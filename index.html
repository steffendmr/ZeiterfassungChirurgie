function getBremenHolidays(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31)-1,dy=((h+l-7*mm+114)%31)+1;
  const ea=new Date(year,mo,dy);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([`${year}-01-01`,fmt(add(ea,-2)),fmt(ea),fmt(add(ea,1)),`${year}-05-01`,fmt(add(ea,39)),fmt(add(ea,49)),fmt(add(ea,50)),`${year}-10-03`,`${year}-10-31`,`${year}-12-25`,`${year}-12-26`]);
}
function dateKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isHolEve(y,m,d,hols){const nx=new Date(y,m,d+1);return hols.has(dateKey(nx.getFullYear(),nx.getMonth(),nx.getDate()));}
function isFriLike(y,m,d,hols){return new Date(y,m,d).getDay()===5||isHolEve(y,m,d,hols);}
function isWE(y,m,d){const dw=new Date(y,m,d).getDay();return dw===0||dw===6;}
function isHol(y,m,d,hols){return hols.has(dateKey(y,m,d));}
function getISOWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);}

const BASE_MON_THU=8.0,BASE_FRI=8.0;
function getEffPct(y,m,d,s){const pct=s.contractPct||100;if(!s.partTimeStart)return pct;return new Date(y,m,d)>=new Date(s.partTimeStart)?pct:100;}
function getDailySoll(y,m,d,hols,s){
  if(isWE(y,m,d)||isHol(y,m,d,hols))return 0;
  const pct=getEffPct(y,m,d,s);
  if(s.partTimeMode==="fixedDay"&&s.fixedDayOff&&new Date(y,m,d).getDay()===Number(s.fixedDayOff)&&pct<100)return 0;
  return(isFriLike(y,m,d,hols)?BASE_FRI:BASE_MON_THU)*(pct/100);
}
function calcBreak(gm){return gm>9.5*60?45:30;}
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>t.h*60+t.m;
const fmtT=t=>`${pad(t.h)}:${pad(t.m)}`;
const fmtH=h=>{const a=Math.abs(h),hh=Math.floor(a),mm=Math.round((a-hh)*60);return`${hh}h${mm>0?" "+mm+"m":""}`;};
const ML=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function computeHours(y,m,d,entry,hols,settings,shiftTimes){
  const soll=getDailySoll(y,m,d,hols,settings);
  if(!entry)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  const SHIFTS=buildShifts(shiftTimes);
  const shift=SHIFTS[entry.shiftType];
  if(!shift)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  if(shift.isOnCall)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0,onCallHours:entry.onCallActivationHours||0};
  if(shift.isOTFree)return{net:soll,soll,gross:soll,breakMin:0,paidExtra:0,overtime:0,isOTFree:true,otFreeHours:soll};
  if(shift.noTimer){const n=shift.noSoll?0:soll;return{net:n,soll,gross:n,breakMin:0,paidExtra:0,overtime:0};}
  const fri=isFriLike(y,m,d,hols);
  const startT=shift.getStart(fri);
  const fixedEnd=shift.fixedEnd?shift.fixedEnd():null;
  const endT=entry.endTime||shift.getEnd?.(fri)||fixedEnd;
  if(!startT||!endT)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  let gm=toMin(endT)-toMin(startT);if(gm<0)gm+=24*60;
  const bm=calcBreak(gm),nh=(gm-bm)/60;
  if(shift.allPaid)return{net:0,soll,gross:gm/60,breakMin:bm,paidExtra:nh,overtime:0};
  let pe=0;
  if(shift.hasPaidExtra&&fixedEnd&&!shift.allPaid){const fe=toMin(fixedEnd),ee=toMin(endT);if(ee>fe)pe=(ee-fe)/60;}
  else if(shift.paidExtraAfterSoll){const ov=nh-soll;if(ov>0)pe=ov;}
  const nfs=nh-pe;
  const ot=shift.paidExtraAfterSoll?0:Math.max(0,nfs-soll);
  return{net:nfs,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
}

function computeOTUpToToday(entries,settings,today){
  const years=[...new Set(Object.keys(entries).map(k=>Number(k.split("-")[0])))];
  let total=0;const shiftTimes=settings.shiftTimes||{};
  for(const y of years){const yh=getBremenHolidays(y);for(let mo=0;mo<12;mo++){const dim=new Date(y,mo+1,0).getDate();for(let d=1;d<=dim;d++){if(new Date(y,mo,d)>today)continue;const e=entries[dateKey(y,mo,d)];if(!e)continue;total+=computeHours(y,mo,d,e,yh,settings,shiftTimes).overtime;}}}
  return total;
}

function exportExcel(entries,adjustments,settings){
  const shiftTimes=settings.shiftTimes||{};
  const rows=[["Datum","Wochentag","Dienstform","Start","Ende","Brutto","Pause","Netto","Überstunden","Ausgezahlt","Notiz"]];
  Object.keys(entries).sort().forEach(key=>{
    const[y,m,d]=[...key.split("-").map(Number)];const mo=m-1;
    const hols=getBremenHolidays(y);const entry=entries[key];
    const SHIFTS=buildShifts(shiftTimes);const shift=SHIFTS[entry.shiftType];
    const c=computeHours(y,mo,d,entry,hols,settings,shiftTimes);
    const date=new Date(y,mo,d);const dow=["So","Mo","Di","Mi","Do","Fr","Sa"][date.getDay()];
    const fri=isFriLike(y,mo,d,hols);
    const startT=shift&&!shift.noTimer&&!shift.isOnCall?shift.getStart?.(fri):null;
    const endT=entry.endTime||(shift?.fixedEnd?.())||null;
    rows.push([`${d}.${m}.${y}`,dow,shift?.label||entry.shiftType,startT?fmtT(startT):"",endT?fmtT(endT):"",c.gross>0?`${c.gross.toFixed(2)}h`:"",c.breakMin>0?`${c.breakMin}min`:"",c.net>0?`${c.net.toFixed(2)}h`:"",c.overtime>0?`+${c.overtime.toFixed(2)}h`:"",c.paidExtra>0?`${c.paidExtra.toFixed(2)}h`:"",entry.note||""]);
  });
  const adjRows=[["Datum","Typ","Stunden","Notiz"]];
  adjustments.forEach(a=>adjRows.push([a.date,a.type,a.hours,a.note||""]));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Dienste");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(adjRows),"Abbuchungen");
  XLSX.writeFile(wb,"Zeiterfassung.xlsx");
}

function App(){
  const[session,setSession]=useState(null);const[authLoading,setAuthLoading]=useState(true);
  const[entries,setEntries]=useState({});const[adjustments,setAdjustments]=useState([]);
  const[settings,setSettings]=useState({contractPct:100,shiftTimes:{},partTimeMode:"none",fixedDayOff:null,partTimeStart:null,overtimeCarryover:0,overtimeCarryoverDate:null});
  const[syncing,setSyncing]=useState(false);const[lastSync,setLastSync]=useState(null);
  useEffect(()=>{sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthLoading(false);});const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s));return()=>subscription.unsubscribe();},[]);
  useEffect(()=>{if(session)loadData();},[session]);
  const loadData=async()=>{setSyncing(true);try{const uid=session.user.id;const[eR,aR,sR]=await Promise.all([sb.from("entries").select("*").eq("user_id",uid),sb.from("adjustments").select("*").eq("user_id",uid),sb.from("settings").select("*").eq("user_id",uid).maybeSingle()]);if(eR.data){const map={};eR.data.forEach(r=>{map[r.date_key]=JSON.parse(r.data);});setEntries(map);}if(aR.data)setAdjustments(aR.data.map(r=>JSON.parse(r.data)));if(sR.data)setSettings(s=>({...s,...JSON.parse(sR.data.data)}));setLastSync(new Date());}catch(e){console.error(e);}setSyncing(false);};
  const saveEntry=async(key,data)=>{setEntries(p=>({...p,[key]:data}));await sb.from("entries").upsert({user_id:session.user.id,date_key:key,data:JSON.stringify(data)},{onConflict:"user_id,date_key"});setLastSync(new Date());};
  const deleteEntry=async(key)=>{setEntries(p=>{const n={...p};delete n[key];return n;});await sb.from("entries").delete().eq("user_id",session.user.id).eq("date_key",key);setLastSync(new Date());};
  const saveAdjustments=async(adjs)=>{setAdjustments(adjs);const uid=session.user.id;await sb.from("adjustments").delete().eq("user_id",uid);if(adjs.length>0)await sb.from("adjustments").insert(adjs.map((a,i)=>({user_id:uid,idx:i,data:JSON.stringify(a)})));setLastSync(new Date());};

  return<MainView session={session} entries={entries} adjustments={adjustments} settings={settings} syncing={syncing} lastSync={lastSync} onSaveEntry={saveEntry} onDeleteEntry={deleteEntry} onSaveAdjustments={saveAdjustments} onSaveSettings={saveSettings} onLogout={()=>sb.auth.signOut()}/>;

function MainView({session,entries,adjustments,settings,syncing,lastSync,onSaveEntry,onDeleteEntry,onSaveAdjustments,onSaveSettings,onLogout}){
  const todayRaw=new Date();const today=new Date(todayRaw);today.setHours(23,59,59,999);
  const[view,setView]=useState("kalender");const[year,setYear]=useState(todayRaw.getFullYear());const[month,setMonth]=useState(todayRaw.getMonth());
  const[modalDay,setModalDay]=useState(null);const[adjModal,setAdjModal]=useState(false);const[adjForm,setAdjForm]=useState({date:"",hours:"",type:"abgefeiert",note:""});const[showUser,setShowUser]=useState(false);
  const shiftTimes=settings.shiftTimes||{};
  const SHIFTS=useMemo(()=>buildShifts(shiftTimes),[JSON.stringify(shiftTimes)]);
  const holidays=useMemo(()=>getBremenHolidays(year),[year]);
  const getEntry=(y,m,d)=>entries[dateKey(y,m,d)]||null;

  const handleSaveEntry=async(key,data)=>{
    const[y,mo,d]=[...key.split("-").map(Number)];const m=mo-1;
    const hols=getBremenHolidays(y);
    const c=computeHours(y,m,d,data,hols,settings,shiftTimes);
    if(c.isOTFree&&c.otFreeHours>0){
      const newAdj={date:key,hours:parseFloat(c.otFreeHours.toFixed(4)),type:"abgefeiert",note:data.note?`Überstundenfrei${data.note?" – "+data.note:""}`:"Überstundenfrei"};
      const existing=adjustments.filter(a=>!(a.date===key&&a.note==="Überstundenfrei"));
      await onSaveAdjustments([...existing,newAdj]);
    } else {
      const filtered=adjustments.filter(a=>!(a.date===key&&a.note==="Überstundenfrei"));
      if(filtered.length!==adjustments.length)await onSaveAdjustments(filtered);
    }
    await onSaveEntry(key,data);
  };
  const handleDeleteEntry=async(key)=>{
    const filtered=adjustments.filter(a=>!(a.date===key&&a.note==="Überstundenfrei"));
    if(filtered.length!==adjustments.length)await onSaveAdjustments(filtered);
    await onDeleteEntry(key);
  };

  const monthAgg=useCallback((y,m2)=>{
    const hols=getBremenHolidays(y);const dim=new Date(y,m2+1,0).getDate();
    let overtime=0,worked=0,paidExtra=0;
    for(let d=1;d<=dim;d++){const e=entries[dateKey(y,m2,d)];if(!e)continue;const c=computeHours(y,m2,d,e,hols,settings,shiftTimes);worked+=c.net;paidExtra+=c.paidExtra;if(new Date(y,m2,d)<=today)overtime+=c.overtime;}
    return{worked,overtime,paidExtra};
  },[entries,JSON.stringify(settings),JSON.stringify(shiftTimes),today.toDateString()]);

  const monthlyData=useMemo(()=>MS.map((_,m2)=>monthAgg(year,m2)),[year,monthAgg]);
  const allOT=useMemo(()=>computeOTUpToToday(entries,settings,today),[entries,JSON.stringify(settings),today.toDateString()]);
  const allOTWithCarryover=allOT+(settings.overtimeCarryover||0)-adjustments.reduce((s,a)=>s+a.hours,0);
  const yearAdj=adjustments.filter(a=>new Date(a.date).getFullYear()===year);

    <div style={{background:C.topBar,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:100,paddingTop:"env(safe-area-inset-top)",boxShadow:`0 1px 8px ${C.primary}18`,width:"100%"}}>

    </div><div style={{position:"fixed",inset:0,zIndex:299}} onClick={()=>setShowUser(false)}/></>)}

    {view==="kalender"&&(<div className="fu" style={{width:"100%",maxWidth:860,margin:"0 auto",padding:"10px 8px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>

        <div style={{display:"flex",gap:10}}>
          {[{l:"Gearbeitet",v:fmtH(cur.worked),c:C.primaryText},{l:"Überstunden",v:`+${fmtH(cur.overtime)}`,c:C.green},...(cur.paidExtra>0?[{l:"Ausgezahlt",v:fmtH(cur.paidExtra),c:C.amber}]:[])].map(s=>(<div key={s.l} style={{textAlign:"right"}}><div style={{fontSize:9,color:C.faint,fontWeight:600,marginBottom:1}}>{s.l.toUpperCase()}</div><div style={{fontSize:13,fontWeight:700,color:s.c}}>{s.v}</div></div>))}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:2,marginBottom:2}}>
        {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>(<div key={d} style={{textAlign:"center",fontSize:10,color:C.faint,padding:"2px 0",fontWeight:600}}>{d}</div>))}
      </div>
      {(()=>{
        const cells=[...Array.from({length:firstDow},(_,i)=>({empty:true,key:`e${i}`})),...Array.from({length:daysInMonth},(_,i)=>({day:i+1}))];
        while(cells.length%7!==0)cells.push({empty:true,key:`t${cells.length}`});
        const weeks=[];for(let w=0;w<cells.length/7;w++)weeks.push(cells.slice(w*7,w*7+7));
        return weeks.map((week,wi)=>{
          let wWorked=0,wPaid=0;
          week.forEach(c=>{if(!c.day)return;const e=getEntry(year,month,c.day);if(!e)return;const ch=computeHours(year,month,c.day,e,holidays,settings,shiftTimes);wWorked+=ch.net+ch.paidExtra;wPaid+=ch.paidExtra;});
          return(<div key={wi}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:2,marginBottom:2}}>

                const isFuture=new Date(year,month,d)>todayRaw;
                const entry=getEntry(year,month,d);const shift=entry?SHIFTS[entry.shiftType]:null;
                const ch=entry?computeHours(year,month,d,entry,holidays,settings,shiftTimes):null;

                return(<div key={d} className="dcell" onClick={()=>setModalDay({year,month,day:d})} style={{minHeight:66,borderRadius:9,padding:"5px 4px",background:shift?shift.bg:isDayOff?"#F0FDF4":we||hol?"#FDF5EE":C.card,border:isToday?`2px solid ${C.primary}`:shift?`2px solid ${shift.color}`:` 1px solid ${C.border}`,boxShadow:isToday?`0 0 0 3px ${C.primary}25`:`0 1px 3px ${C.primary}08`,opacity:hol?0.6:isFuture?0.75:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?C.primary:hol?C.purple:we?C.faint:C.muted}}>{d}</span>
                    <div style={{display:"flex",gap:2}}>{holEve&&<span style={{fontSize:7,color:C.purple,fontWeight:700}}>VFT</span>}{hol&&<span style={{fontSize:7,color:C.purple,fontWeight:700}}>FT</span>}</div>
                  </div>
                  {isDayOff&&!entry&&<div style={{fontSize:9,color:C.green,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>🌿 TZ-frei</div>}
                  {shift&&!shift.isOnCall&&!shift.noTimer&&(<div style={{overflow:"hidden"}}><div style={{fontSize:13,lineHeight:1.2}}>{shift.icon}<div style={{fontSize:9,color:shift.color,fontWeight:700,lineHeight:1.1}}>{({"TAGDIENST":"TD","LANGER_DIENST":"LD","LANGER_DIENST_WE":"LD-W","VISITENDIENST":"VD","SPAETDIENST":"SD","RUFBEREITSCHAFT":"Rufb","UEBERSTUNDENFREI":"ÜStF","TEILZEITFREI":"TZF","DIENSTFREI":"Frei","URLAUB":"Url","KRANK":"Krnk","FORTBILDUNG":"Fortb"})[entry.shiftType]||entry.shiftType}</div></div>{entry.endTime&&<div style={{fontSize:9,color:C.muted,whiteSpace:"nowrap"}}>{fmtT(SHIFTS[entry.shiftType].getStart?.(isFriLike(year,month,d,holidays))||{h:0,m:0})}–{fmtT(entry.endTime)}</div>}{!isFuture&&ch?.overtime>0&&<div style={{fontSize:9,color:C.green,fontWeight:700}}>+{fmtH(ch.overtime)}</div>}{ch?.paidExtra>0&&<div style={{fontSize:8,color:C.amber,fontWeight:600}}>💶{fmtH(ch.paidExtra)}</div>}</div>)}
                  {shift?.noTimer&&<div style={{fontSize:13,lineHeight:1.2}}>{shift.icon}<div style={{fontSize:9,color:shift.color,fontWeight:700,lineHeight:1.1}}>{({"UEBERSTUNDENFREI":"ÜStF","TEILZEITFREI":"TZF","DIENSTFREI":"Frei","URLAUB":"Url","KRANK":"Krnk","FORTBILDUNG":"Fortb","RUFBEREITSCHAFT":"Rufb"})[entry.shiftType]||entry.shiftType}</div></div>}
                  {shift?.isOnCall&&<div style={{fontSize:10,color:shift.color,fontWeight:700,whiteSpace:"nowrap"}}>📞{entry.onCallActivationHours>0&&<span style={{color:C.amber}}>{entry.onCallActivationHours}h</span>}</div>}
                </div>);
              })}
            </div>
            {wWorked>0&&<div style={{display:"flex",justifyContent:"flex-end",gap:8,padding:"2px 3px 6px",borderBottom:`1px solid ${C.border}`,marginBottom:3,fontSize:10,color:C.muted}}>
              <span style={{color:C.faint}}>KW {getISOWeek(new Date(year,month,week.find(c=>c.day)?.day))}</span>
              <span>⏱ <strong style={{color:C.primaryText}}>{fmtH(wWorked)}</strong></span>
              {wPaid>0&&<span>💶 <strong style={{color:C.amber}}>{fmtH(wPaid)}</strong></span>}
            </div>}
          </div>);
        });
      })()}
      <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:5}}>
        {Object.entries(SHIFTS).map(([k,s])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:C.muted}}><div style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/>{s.icon} {s.label}</div>))}
        <div style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:C.muted}}><span style={{color:C.purple,fontWeight:700,fontSize:9}}>FT</span>Feiertag</div>
      </div>
    </div>)}

    {view==="jahres"&&(<div className="fu" style={{width:"100%",maxWidth:820,margin:"0 auto",padding:"10px 8px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        {[{l:"Gesamtüberstunden",v:`+${fmtH(allOTWithCarryover)}`,c:C.green,bg:C.greenBg,big:true},{l:`Überstunden ${year}`,v:`+${fmtH(yearOvertime)}`,c:C.primaryText,bg:C.primaryLight,big:true},{l:"Gesamtarbeitszeit",v:fmtH(yearWorked),c:C.text,bg:C.card},{l:"Abgebaut/Ausgezahlt",v:fmtH(yearAdjTotal),c:C.amber,bg:C.amberBg},{l:"Sofort ausgezahlt",v:fmtH(yearPaidExtra),c:C.amber,bg:C.amberBg},...(settings.overtimeCarryover?[{l:`Übertrag bis ${settings.overtimeCarryoverDate?new Date(settings.overtimeCarryoverDate).toLocaleDateString("de-DE"):"–"}`,v:`+${fmtH(settings.overtimeCarryover||0)}`,c:C.purple,bg:C.purpleBg}]:[]),{l:"Dienste "+year,v:Object.keys(entries).filter(k=>k.startsWith(String(year))).length+" Tage",c:C.muted,bg:C.card}].map(card=>(<div key={card.l} style={{background:card.bg,borderRadius:12,padding:"11px 12px",border:`1px solid ${C.border}`,boxShadow:`0 1px 4px ${C.primary}10`}}><div style={{fontSize:9,color:C.muted,fontWeight:600,marginBottom:3}}>{card.l.toUpperCase()}</div><div style={{fontSize:card.big?20:15,fontWeight:700,color:card.c}}>{card.v}</div></div>))}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",marginBottom:10}}>
        <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:8}}>ÜBERSTUNDEN PRO MONAT {year} (bis heute)</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:64}}>
          {monthlyData.map((md,i)=>{const mx=Math.max(...monthlyData.map(m=>m.overtime),1),p2=md.overtime/mx,has=md.overtime>0;return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>{has&&<div style={{fontSize:7,color:C.green,fontWeight:700,textAlign:"center",width:"100%"}}>{fmtH(md.overtime)}</div>}<div style={{width:"100%",height:`${Math.max(p2*42,has?3:1)}px`,background:has?C.green:C.border,borderRadius:"3px 3px 0 0"}}/><div style={{fontSize:9,color:i===month?C.primary:C.faint,fontWeight:i===month?700:400,textAlign:"center",width:"100%"}}>{MS[i]}</div></div>);})}
        </div>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",marginBottom:10}}>
        <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:7}}>MONATSÜBERSICHT {year}</div>
        <div style={{display:"grid",gridTemplateColumns:"minmax(0,50px) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)"}}>
          {["MONAT","GEARBEITET","ÜBERSTD.","AUSGEZ."].map(h=>(<div key={h} style={{fontSize:9,color:C.faint,fontWeight:600,padding:"3px 4px",borderBottom:`1px solid ${C.border}`}}>{h}</div>))}
          {monthlyData.map((md,i)=>[<div key={`m${i}`} style={{fontSize:12,padding:"5px 4px",borderBottom:`1px solid ${C.cardWarm}`,fontWeight:i===month?700:400,color:i===month?C.primary:C.text}}>{MS[i]}</div>,<div key={`w${i}`} style={{fontSize:12,padding:"5px 4px",borderBottom:`1px solid ${C.cardWarm}`,color:C.muted}}>{md.worked>0?fmtH(md.worked):"–"}</div>,<div key={`d${i}`} style={{fontSize:12,padding:"5px 4px",borderBottom:`1px solid ${C.cardWarm}`,color:md.overtime>0?C.green:C.faint,fontWeight:md.overtime>0?700:400}}>{md.overtime>0?`+${fmtH(md.overtime)}`:"–"}</div>,<div key={`p${i}`} style={{fontSize:12,padding:"5px 4px",borderBottom:`1px solid ${C.cardWarm}`,color:md.paidExtra>0?C.amber:C.faint}}>{md.paidExtra>0?fmtH(md.paidExtra):"–"}</div>])}
        </div>
      </div>
      <CarryoverCard settings={settings} onSave={onSaveSettings}/>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>

        {yearAdj.map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:5,padding:"6px 2px",borderRadius:7}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:a.type==="abgefeiert"?C.green:C.amber,flexShrink:0}}/>
          <div style={{fontSize:11,color:C.muted,minWidth:72,flexShrink:0}}>{new Date(a.date).toLocaleDateString("de-DE")}</div>

          <div style={{fontSize:11,color:C.red,fontWeight:600,minWidth:40,textAlign:"right",flexShrink:0}}>-{fmtH(a.hours)}</div>
          <button onClick={()=>onSaveAdjustments(adjustments.filter((_,j)=>j!==adjustments.indexOf(a)))} style={{background:"none",border:"none",color:C.faint,fontSize:18,lineHeight:1,flexShrink:0}}>×</button>
        </div>))}

    </div>)}

    {view==="einstellungen"&&<SettingsView settings={settings} onSave={onSaveSettings}/>}

    {modalDay&&<DayModal day={modalDay} holidays={holidays} entry={getEntry(modalDay.year,modalDay.month,modalDay.day)} settings={settings} shiftTimes={shiftTimes} SHIFTS={SHIFTS}
      onSave={data=>handleSaveEntry(dateKey(modalDay.year,modalDay.month,modalDay.day),data).then(()=>setModalDay(null))}
      onDelete={()=>handleDeleteEntry(dateKey(modalDay.year,modalDay.month,modalDay.day)).then(()=>setModalDay(null))}
      onClose={()=>setModalDay(null)}/>}
    {adjModal&&<AdjModal form={adjForm} onChange={setAdjForm} onSave={()=>{if(!adjForm.hours||isNaN(+adjForm.hours))return;onSaveAdjustments([...adjustments,{...adjForm,hours:+adjForm.hours}]);setAdjModal(false);}} onClose={()=>setAdjModal(false)}/>}
  </div>);
}

function CarryoverCard({settings,onSave}){
  const[hours,setHours]=useState(settings.overtimeCarryover||"");const[date,setDate]=useState(settings.overtimeCarryoverDate||"");const[saved,setSaved]=useState(false);const[open,setOpen]=useState(false);
  const hasValue=Number(settings.overtimeCarryover)>0;
  const save=async()=>{await onSave({...settings,overtimeCarryover:hours!==""?Number(hours):0,overtimeCarryoverDate:date||null});setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const clear=async()=>{setHours("");setDate("");await onSave({...settings,overtimeCarryover:0,overtimeCarryoverDate:null});};
  return(<div style={{background:C.card,border:`1px solid ${hasValue?C.purple:C.border}`,borderRadius:12,padding:"12px",marginBottom:10}}>
    <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"none",border:"none",padding:0,textAlign:"left"}}>
      <div><div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:2}}>ÜBERSTUNDEN-ÜBERTRAG</div>{hasValue?<div style={{fontSize:13,fontWeight:700,color:C.purple}}>+{fmtH(settings.overtimeCarryover)} bis {settings.overtimeCarryoverDate?new Date(settings.overtimeCarryoverDate).toLocaleDateString("de-DE"):"–"}</div>:<div style={{fontSize:12,color:C.faint}}>Überstunden vor App-Nutzung eintragen</div>}</div>
      <span style={{fontSize:12,color:C.muted,marginLeft:8}}>{open?"▲":"▼"}</span>
    </button>
    {open&&(<div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>STUNDEN</div><input type="number" min={0} step={0.5} value={hours} onChange={e=>setHours(e.target.value)} placeholder="z.B. 24.5" style={{width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"8px 10px",fontSize:14,fontWeight:700,color:C.text,fontFamily:"inherit"}}/></div>
        <div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>BIS ZUM DATUM</div><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"8px 10px",fontSize:12,color:C.text,fontFamily:"inherit"}}/></div>
      </div>
      <div style={{display:"flex",gap:7}}>{hasValue&&<button onClick={clear} style={{padding:"8px 12px",background:C.redBg,border:`1px solid #FECACA`,borderRadius:9,color:C.red,fontSize:12,fontWeight:600}}>Löschen</button>}<button onClick={save} style={{flex:1,padding:"9px",background:saved?C.purple:C.primary,border:"none",borderRadius:9,color:"#fff",fontSize:13,fontWeight:700,transition:"background .3s"}}>{saved?"✓ Gespeichert!":"Speichern"}</button></div>
    </div>)}
  </div>);
}

function SettingsView({settings,onSave}){
  const[pct,setPct]=useState(settings.contractPct||100);const[ptMode,setPtMode]=useState(settings.partTimeMode||"none");const[fixedDay,setFixedDay]=useState(settings.fixedDayOff||1);const[ptStart,setPtStart]=useState(settings.partTimeStart||"");const[times,setTimes]=useState(settings.shiftTimes||{});const[saved,setSaved]=useState(false);const[openShift,setOpenShift]=useState(null);
  const save=async()=>{await onSave({...settings,contractPct:Number(pct),partTimeMode:ptMode,fixedDayOff:Number(fixedDay),partTimeStart:ptStart||null,shiftTimes:times});setSaved(true);setTimeout(()=>setSaved(false),2500);};
  const updT=(key,field,val)=>setTimes(p=>{const def=DEFAULT_TIMES[key]||{};return{...p,[key]:{...def,...(p[key]||{}),[field]:Number(val)}};});
  const editableKeys=["TAGDIENST","LANGER_DIENST","LANGER_DIENST_WE","VISITENDIENST","SPAETDIENST"];
  const SHIFTS=buildShifts(times);
  const card={background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"13px",marginBottom:10};
  const sl={fontSize:11,color:C.muted,fontWeight:600,marginBottom:7};
  return(<div className="fu" style={{width:"100%",maxWidth:580,margin:"0 auto",padding:"10px 8px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
    <h2 style={{fontSize:17,fontWeight:700,color:C.text,marginBottom:10}}>Einstellungen</h2>
    <div style={card}><div style={sl}>STELLENUMFANG</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>{[100,90,80,75,60,50].map(p=>(<button key={p} onClick={()=>setPct(p)} style={{padding:"7px 12px",borderRadius:9,fontSize:13,fontWeight:600,background:pct===p?C.primaryLight:C.bg,border:`1.5px solid ${pct===p?C.primary:C.border}`,color:pct===p?C.primaryText:C.muted}}>{p}%</button>))}<input type="number" min={10} max={100} value={pct} onChange={e=>setPct(e.target.value)} style={{width:62,padding:"7px",borderRadius:9,border:`1.5px solid ${C.border}`,background:C.bg,fontSize:13,color:C.text,textAlign:"center"}}/></div>
      <div style={{background:C.primaryLight,borderRadius:8,padding:"8px 11px",fontSize:12,color:C.primaryText}}>Bei {pct}%: Mo–Do <strong>{fmtH(8.0*pct/100)}</strong> · Fr/VFT <strong>{fmtH(7.5*pct/100)}</strong></div>
    </div>
    <div style={card}><div style={sl}>TEILZEITMODELL</div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>{[["none","Kein festes Modell"],["fixedDay","Fester freier Tag pro Woche"],["freeWeek","Freie Woche (manuell)"]].map(([v,l])=>(<button key={v} onClick={()=>setPtMode(v)} style={{padding:"8px 12px",borderRadius:9,fontSize:13,textAlign:"left",fontWeight:ptMode===v?700:400,background:ptMode===v?C.primaryLight:C.bg,border:`1.5px solid ${ptMode===v?C.primary:C.border}`,color:ptMode===v?C.primaryText:C.muted}}>{l}</button>))}</div>
      {ptMode==="fixedDay"&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{[[1,"Mo"],[2,"Di"],[3,"Mi"],[4,"Do"],[5,"Fr"]].map(([v,l])=>(<button key={v} onClick={()=>setFixedDay(v)} style={{padding:"7px 12px",borderRadius:9,fontSize:13,fontWeight:600,background:fixedDay===v?C.primaryLight:C.bg,border:`1.5px solid ${fixedDay===v?C.primary:C.border}`,color:fixedDay===v?C.primaryText:C.muted}}>{l}</button>))}</div>}
    </div>
    <div style={card}><div style={sl}>TEILZEIT AB DATUM (optional)</div>
      <div style={{display:"flex",gap:7,alignItems:"center"}}><input type="date" value={ptStart} onChange={e=>setPtStart(e.target.value)} style={{flex:1,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"8px 11px",fontSize:13,color:C.text}}/>{ptStart&&<button onClick={()=>setPtStart("")} style={{padding:"8px 10px",background:C.redBg,border:`1px solid #FECACA`,color:C.red,borderRadius:8,fontSize:12,fontWeight:600}}>✕</button>}</div>
      {ptStart&&<div style={{marginTop:7,fontSize:11,color:C.primaryText,background:C.primaryLight,borderRadius:7,padding:"6px 10px"}}>Vor {new Date(ptStart).toLocaleDateString("de-DE")}: 100% · Ab dann: {pct}%</div>}
    </div>
    <div style={card}><div style={sl}>DIENSTZEITEN ANPASSEN</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:8}}>Änderungen gelten auch für bereits eingetragene Dienste.</div>
      {editableKeys.map(k=>{const s=SHIFTS[k];const def=DEFAULT_TIMES[k]||{};const cur={...def,...(times[k]||{})};const isOpen=openShift===k;return(<div key={k} style={{marginBottom:6,border:`1.5px solid ${isOpen?s.color:C.border}`,borderRadius:10,overflow:"hidden"}}>
        <button onClick={()=>setOpenShift(isOpen?null:k)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",background:isOpen?s.bg:C.bg,border:"none",textAlign:"left"}}><span style={{fontSize:13,fontWeight:600,color:C.text}}>{s.icon} {s.label}</span><span style={{fontSize:11,color:C.muted}}>{isOpen?"▲":"▼"}</span></button>
        {isOpen&&(<div style={{padding:"10px 12px",background:s.bg,borderTop:`1px solid ${s.color}30`}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {k==="TAGDIENST"&&(<><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>START</div><TI h={cur.startH} m={cur.startM} onH={v=>updT(k,"startH",v)} onM={v=>updT(k,"startM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>ENDE Mo–Do</div><TI h={cur.endH} m={cur.endM} onH={v=>updT(k,"endH",v)} onM={v=>updT(k,"endM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>ENDE Fr/VFT</div><TI h={cur.endFriH} m={cur.endFriM} onH={v=>updT(k,"endFriH",v)} onM={v=>updT(k,"endFriM",v)}/></div></>)}
            {k==="LANGER_DIENST"&&(<><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>START Mo–Do</div><TI h={cur.startH} m={cur.startM} onH={v=>updT(k,"startH",v)} onM={v=>updT(k,"startM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>ENDE Mo–Do</div><TI h={cur.endH} m={cur.endM} onH={v=>updT(k,"endH",v)} onM={v=>updT(k,"endM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>START Fr/VFT</div><TI h={cur.startFriH} m={cur.startFriM} onH={v=>updT(k,"startFriH",v)} onM={v=>updT(k,"startFriM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>ENDE Fr/VFT</div><TI h={cur.endFriH} m={cur.endFriM} onH={v=>updT(k,"endFriH",v)} onM={v=>updT(k,"endFriM",v)}/></div></>)}
            {k==="LANGER_DIENST_WE"&&(<><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>START</div><TI h={cur.startH} m={cur.startM} onH={v=>updT(k,"startH",v)} onM={v=>updT(k,"startM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>ENDE (8:30+12h+45min)</div><TI h={cur.endH} m={cur.endM} onH={v=>updT(k,"endH",v)} onM={v=>updT(k,"endM",v)}/></div></>)}
            {(k==="VISITENDIENST"||k==="SPAETDIENST")&&(<><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>START</div><TI h={cur.startH} m={cur.startM} onH={v=>updT(k,"startH",v)} onM={v=>updT(k,"startM",v)}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>PFLICHTENDE</div><TI h={cur.fixedEndH} m={cur.fixedEndM} onH={v=>updT(k,"fixedEndH",v)} onM={v=>updT(k,"fixedEndM",v)}/></div></>)}
          </div>
          <button onClick={()=>setTimes(p=>{const n={...p};delete n[k];return n;})} style={{marginTop:8,fontSize:11,color:C.muted,background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 9px"}}>Zurücksetzen</button>
        </div>)}
      </div>);})}
    </div>
    <button onClick={save} style={{width:"100%",padding:"13px",background:saved?C.green:C.primary,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:700,boxShadow:`0 4px 14px ${C.primary}40`,transition:"background .3s"}}>{saved?"✓ Gespeichert!":"Einstellungen speichern"}</button>
  </div>);
}

function TI({h,m,onH,onM}){
  const s={width:48,padding:"6px 3px",borderRadius:7,border:`1.5px solid ${C.border}`,background:C.card,fontSize:15,fontWeight:700,textAlign:"center",color:C.text};
  return(<div style={{display:"flex",alignItems:"center",gap:3}}><input type="number" min={0} max={23} value={pad(h||0)} onChange={e=>onH(e.target.value)} style={s}/><span style={{color:C.muted,fontWeight:700}}>:</span><input type="number" min={0} max={59} value={pad(m||0)} onChange={e=>onM(e.target.value)} style={s}/></div>);
}

function DayModal({day,entry,holidays,settings,shiftTimes,SHIFTS,onSave,onDelete,onClose}){
  const{year,month,day:d}=day;const dow=new Date(year,month,d).getDay();
  const we=dow===0||dow===6,hol=isHol(year,month,d,holidays),fri=isFriLike(year,month,d,holidays);
  const[shiftType,setShiftType]=useState(entry?.shiftType||(we?"LANGER_DIENST_WE":"TAGDIENST"));
  const[endH,setEndH]=useState(entry?.endTime?.h??"");const[endM,setEndM]=useState(entry?.endTime?.m??"");
  const[onCallH,setOnCallH]=useState(entry?.onCallActivationHours??"");const[note,setNote]=useState(entry?.note||"");
  const shift=SHIFTS[shiftType];const startT=shift?.getStart?.(fri);const fixedEnd=shift?.fixedEnd?.();const defaultEnd=fixedEnd||shift?.getEnd?.(fri);
  const endTime=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;
  const soll=getDailySoll(year,month,d,holidays,settings);
  let preview=null;
  if(shift?.isOTFree){preview={isOTFree:true,soll,paidExtra:0,overtime:0,net:soll,gross:soll,breakMin:0};}
  else if(startT&&endTime&&!shift?.noTimer&&!shift?.isOnCall){
    let gm=toMin(endTime)-toMin(startT);if(gm<0)gm+=24*60;const bm=calcBreak(gm),nh=(gm-bm)/60;
    let pe=0,ot=0;
    if(shift.allPaid){pe=nh;}else if(shift.hasPaidExtra&&fixedEnd){const et=toMin(endTime),ft=toMin(fixedEnd);if(et>ft)pe=(et-ft)/60;ot=Math.max(0,nh-pe-soll);}else if(shift.paidExtraAfterSoll){const ov=nh-soll;if(ov>0)pe=ov;}else{ot=Math.max(0,nh-soll);}
    preview={net:shift.allPaid?0:nh-pe,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot,isOTFree:false};
  }
  const available=Object.entries(SHIFTS).filter(([k,s])=>!(s.weekendOnly&&!we)&&!(k==="LANGER_DIENST_WE"&&!we));
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 12px",fontSize:13,color:C.text,fontFamily:"inherit"};
  return(<div style={{position:"fixed",inset:0,background:"#2D1A0E60",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(3px)"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="si" style={{background:C.card,borderRadius:"22px 22px 0 0",padding:"16px 14px",width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",paddingBottom:"max(18px,env(safe-area-inset-bottom))"}}>
      <div style={{width:40,height:4,background:C.border,borderRadius:2,margin:"0 auto 12px"}}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
        <div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:2}}>{DL[dow].toUpperCase()}, {d}. {ML[month]} {year}</div>{hol&&<div style={{fontSize:11,color:C.purple,fontWeight:600}}>🎌 Feiertag (Bremen)</div>}{!hol&&fri&&dow!==5&&<div style={{fontSize:11,color:C.purple,fontWeight:600}}>⚡ Vortag Feiertag – wie Freitag</div>}</div>
        <button onClick={onClose} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:28,height:28,fontSize:15,color:C.muted}}>×</button>
      </div>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>DIENSTFORM</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
          {available.map(([k,s])=>(<button key={k} onClick={()=>setShiftType(k)} style={{padding:"7px 8px",borderRadius:9,textAlign:"left",fontSize:11,fontWeight:600,background:shiftType===k?s.bg:C.bg,border:`1.5px solid ${shiftType===k?s.color:C.border}`,color:shiftType===k?C.text:C.muted}}>{s.icon} {s.label}</button>))}
        </div>
      </div>
      {startT&&(<div style={{background:C.bg,borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:12}}><div style={{color:C.muted}}>Start: <strong style={{color:C.text}}>{fmtT(startT)}</strong>{fixedEnd&&<> · Pflichtende: <strong style={{color:C.text}}>{fmtT(fixedEnd)}</strong></>}{!fixedEnd&&defaultEnd&&<> · Planende: <strong style={{color:C.muted}}>{fmtT(defaultEnd)}</strong></>}</div>{shift?.allPaid&&<div style={{color:C.amber,marginTop:2,fontWeight:700}}>💶 Alle Stunden sofort ausgezahlt</div>}{shift?.hasOnCall&&<div style={{color:C.purple,marginTop:2,fontWeight:600}}>📞 Rufbereitschaft nach Dienstende</div>}{shift?.hasPaidExtra&&!shift?.allPaid&&<div style={{color:C.amber,marginTop:2,fontWeight:600}}>💶 Überstunden sofort ausgezahlt</div>}</div>)}
      {shift?.isOTFree&&<div style={{background:C.amberBg,border:`1px solid ${C.amber}`,borderRadius:8,padding:"8px 11px",marginBottom:10,fontSize:12,color:C.amber,fontWeight:600}}>⭐ Netto-Sollstunden ({fmtH(soll)}) werden automatisch als „Abgefeiert" gebucht.</div>}
      {!shift?.noTimer&&!shift?.isOnCall&&(<div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>{shift?.allPaid?"ENDZEIT (alle Stunden ausgezahlt)":shift?.hasPaidExtra?"TATSÄCHLICHE ENDZEIT":"ENDZEIT (leer = Planende)"}</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <input type="number" min={0} max={23} value={endH} onChange={e=>setEndH(e.target.value)} placeholder={defaultEnd?pad(defaultEnd.h):"hh"} style={{width:60,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 6px",fontSize:18,fontWeight:700,color:C.text,textAlign:"center"}}/>
          <span style={{fontSize:20,color:C.muted,fontWeight:700}}>:</span>
          <input type="number" min={0} max={59} value={endM} onChange={e=>setEndM(e.target.value)} placeholder={defaultEnd?pad(defaultEnd.m):"mm"} style={{width:60,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 6px",fontSize:18,fontWeight:700,color:C.text,textAlign:"center"}}/>
          <span style={{fontSize:13,color:C.muted}}>Uhr</span>
          {(endH!==""||endM!=="")&&<button onClick={()=>{setEndH("");setEndM("");}} style={{background:"none",border:"none",color:C.faint,fontSize:18}}>↺</button>}
        </div>
      </div>)}
      {shift?.isOnCall&&(<div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>AKTIVIERUNGSSTUNDEN (ausgezahlt, kein Saldo)</div><input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="z.B. 1.5" style={inp}/></div>)}
      {shift?.hasOnCall&&!shift?.isOnCall&&(<div style={{marginBottom:10}}><div style={{fontSize:11,color:C.purple,fontWeight:600,marginBottom:6}}>📞 RUFBEREITSCHAFT – AKTIVIERUNGSSTUNDEN</div><input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="Einsatzstunden (optional)" style={inp}/></div>)}
      {preview&&(<div style={{background:C.bg,borderRadius:9,padding:"10px 11px",marginBottom:10}}>
        <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:6}}>VORSCHAU</div>
        {!preview.isOTFree&&(<div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:6,marginBottom:6}}>{[["BRUTTO",fmtH(preview.gross)],["PAUSE",`${preview.breakMin}min`],["NETTO",fmtH(preview.net)]].map(([l,v])=>(<div key={l}><div style={{fontSize:9,color:C.faint,fontWeight:600}}>{l}</div><div style={{fontSize:13,fontWeight:700,color:C.text}}>{v}</div></div>))}</div>)}
        {preview.paidExtra>0&&<div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:3}}>💶 Sofort ausgezahlt: {fmtH(preview.paidExtra)}</div>}
        {preview.isOTFree&&<div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:3}}>⭐ Abgefeiert: {fmtH(preview.soll)}</div>}
        <div style={{fontSize:12,fontWeight:700}}>{preview.overtime>0?<span style={{color:C.green}}>+{fmtH(preview.overtime)} Überstunden</span>:preview.paidExtra>0?<span style={{color:C.amber}}>Alle Stunden ausgezahlt</span>:preview.isOTFree?<span style={{color:C.amber}}>Als Überstundenfrei gebucht</span>:<span style={{color:C.muted}}>Keine Überstunden</span>}<span style={{color:C.faint,marginLeft:6,fontWeight:400,fontSize:11}}>Soll: {fmtH(preview.soll)}</span></div>
      </div>)}
      <div style={{marginBottom:12}}><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>NOTIZ (optional)</div><input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder="Station, Einsatz, Bemerkung..." style={inp}/></div>
      <div style={{display:"flex",gap:7}}>
        {entry&&<button onClick={onDelete} style={{padding:"11px 14px",background:C.redBg,border:`1px solid #FECACA`,borderRadius:11,color:C.red,fontSize:13,fontWeight:700}}>Löschen</button>}
        <button onClick={()=>{const et=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;onSave({shiftType,endTime:et,onCallActivationHours:onCallH!==""?+onCallH:0,note});}} style={{flex:1,padding:"12px",background:C.primary,border:"none",borderRadius:11,color:"#fff",fontSize:14,fontWeight:700,boxShadow:`0 4px 14px ${C.primary}40`}}>Speichern</button>
      </div>
    </div>
  </div>);
}

function AdjModal({form,onChange,onSave,onClose}){
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 12px",color:C.text,fontSize:13,fontFamily:"inherit"};
  return(<div style={{position:"fixed",inset:0,background:"#2D1A0E60",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(3px)"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="si" style={{background:C.card,borderRadius:"22px 22px 0 0",padding:"16px 14px",width:"100%",maxWidth:520,paddingBottom:"max(18px,env(safe-area-inset-bottom))"}}>
      <div style={{width:40,height:4,background:C.border,borderRadius:2,margin:"0 auto 12px"}}/>
      <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:12}}>Überstunden abbuchen</div>
      {[{l:"DATUM",f:"date",t:"date"},{l:"STUNDEN",f:"hours",t:"number",pl:"z.B. 8"},{l:"NOTIZ",f:"note",t:"text",pl:"z.B. Freizeitausgleich KW 12"}].map(field=>(<div key={field.f} style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:5}}>{field.l}</div><input type={field.t} value={form[field.f]} placeholder={field.pl} step={field.t==="number"?"0.5":undefined} onChange={e=>onChange(p=>({...p,[field.f]:e.target.value}))} style={inp}/></div>))}
      <div style={{marginBottom:12}}><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>TYP</div><div style={{display:"flex",gap:7}}>{[["abgefeiert","Abgefeiert 🟢",C.green,C.greenBg],["ausgezahlt","Ausgezahlt 🟡",C.amber,C.amberBg]].map(([v,l,col,bg])=>(<button key={v} onClick={()=>onChange(p=>({...p,type:v}))} style={{flex:1,padding:"9px",borderRadius:10,fontSize:13,fontWeight:600,background:form.type===v?bg:C.bg,border:`1.5px solid ${form.type===v?col:C.border}`,color:form.type===v?col:C.muted}}>{l}</button>))}</div></div>
      <button onClick={onSave} style={{width:"100%",padding:"12px",background:C.primary,border:"none",borderRadius:11,color:"#fff",fontSize:14,fontWeight:700}}>Speichern</button>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
