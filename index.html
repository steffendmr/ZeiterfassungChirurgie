// ── Bremen Holidays ───────────────────────────────────────────────────────────
function getBremenHolidays(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31)-1,dy=((h+l-7*m+114)%31)+1;
  const ea=new Date(year,mo,dy);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([`${year}-01-01`,fmt(add(ea,-2)),fmt(ea),fmt(add(ea,1)),`${year}-05-01`,
    fmt(add(ea,39)),fmt(add(ea,49)),fmt(add(ea,50)),`${year}-10-03`,`${year}-10-31`,`${year}-12-25`,`${year}-12-26`]);
}
function dateKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isHolidayEve(y,m,d,hols){const nx=new Date(y,m,d+1);return hols.has(dateKey(nx.getFullYear(),nx.getMonth(),nx.getDate()));}
function isFridayLike(y,m,d,hols){return new Date(y,m,d).getDay()===5||isHolidayEve(y,m,d,hols);}
function isWeekend(y,m,d){const dw=new Date(y,m,d).getDay();return dw===0||dw===6;}
function isHoliday(y,m,d,hols){return hols.has(dateKey(y,m,d));}
function getISOWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);}

  VISITENDIENST:   {startH:8,startM:30,fixedEndH:11,fixedEndM:30},
  SPAETDIENST:     {startH:10,startM:30,fixedEndH:22,fixedEndM:30},
};

const BASE_MON_THU=8.5,BASE_FRI=8.0;
function getDailySoll(y,m,d,hols,pct){
  pct=pct||100;
  if(isWeekend(y,m,d)||isHoliday(y,m,d,hols))return 0;
  return(isFridayLike(y,m,d,hols)?BASE_FRI:BASE_MON_THU)*(pct/100);
}
function calcBreak(gm){return gm>=9.5*60?45:30;}

const pad=n=>String(n).padStart(2,"0");
const toMin=t=>t.h*60+t.m;
const fmtTime=t=>`${pad(t.h)}:${pad(t.m)}`;
const fmtHAbs=h=>{const a=Math.abs(h),hh=Math.floor(a),mm=Math.round((a-hh)*60);return`${hh}h${mm>0?" "+mm+"m":""}`;};

const MONTHS_LONG=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_SHORT=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DOW_LONG=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function computeHours(y,m,d,entry,hols,pct,shiftTimes){
  const soll=getDailySoll(y,m,d,hols,pct);
  if(!entry)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  const SHIFTS=buildShifts(shiftTimes);
  const shift=SHIFTS[entry.shiftType];
  if(!shift)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  if(shift.isOnCall)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0,onCallHours:entry.onCallActivationHours||0};
  if(shift.noTimer){const n=shift.noSoll?0:soll;return{net:n,soll,gross:n,breakMin:0,paidExtra:0,overtime:0};}
  const fri=isFridayLike(y,m,d,hols);
  const startT=shift.getStart(fri);
  const fixedEnd=shift.fixedEnd?shift.fixedEnd():null;
  const endT=entry.endTime||shift.getEnd?.(fri)||fixedEnd;
  if(!startT||!endT)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  let gm=toMin(endT)-toMin(startT);if(gm<0)gm+=24*60;
  const bm=calcBreak(gm),nh=(gm-bm)/60;
  let pe=0;
  if(shift.hasPaidExtra&&fixedEnd){const fe=toMin(fixedEnd),ee=toMin(endT);if(ee>fe)pe=(ee-fe)/60;}
  else if(shift.paidExtraAfterSoll){const ov=nh-soll;if(ov>0)pe=ov;}
  const nfs=nh-pe;
  const ot=shift.paidExtraAfterSoll?0:Math.max(0,nfs-soll);
  return{net:nfs,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[entries,setEntries]=useState({});
  const[adjustments,setAdjustments]=useState([]);
  const[settings,setSettings]=useState({contractPct:100,shiftTimes:{}});
  const[syncing,setSyncing]=useState(false);
  const[lastSync,setLastSync]=useState(null);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{if(session)loadData();},[session]);

  const loadData=async()=>{
    setSyncing(true);
    try{
      const uid=session.user.id;
      const[eR,aR,sR]=await Promise.all([
        sb.from("entries").select("*").eq("user_id",uid),
        sb.from("adjustments").select("*").eq("user_id",uid),
        sb.from("settings").select("*").eq("user_id",uid).maybeSingle(),
      ]);
      if(eR.data){const map={};eR.data.forEach(r=>{map[r.date_key]=JSON.parse(r.data);});setEntries(map);}
      if(aR.data)setAdjustments(aR.data.map(r=>JSON.parse(r.data)));
      if(sR.data)setSettings(JSON.parse(sR.data.data));
      setLastSync(new Date());
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  const saveEntry=async(key,data)=>{
    setEntries(p=>({...p,[key]:data}));
    await sb.from("entries").upsert({user_id:session.user.id,date_key:key,data:JSON.stringify(data)},{onConflict:"user_id,date_key"});
    setLastSync(new Date());
  };
  const deleteEntry=async(key)=>{
    setEntries(p=>{const n={...p};delete n[key];return n;});
    await sb.from("entries").delete().eq("user_id",session.user.id).eq("date_key",key);
    setLastSync(new Date());
  };
  const saveAdjustments=async(adjs)=>{
    setAdjustments(adjs);
    const uid=session.user.id;
    await sb.from("adjustments").delete().eq("user_id",uid);
    if(adjs.length>0)await sb.from("adjustments").insert(adjs.map((a,i)=>({user_id:uid,idx:i,data:JSON.stringify(a)})));
    setLastSync(new Date());
  };
  const saveSettings=async(s)=>{
    setSettings(s);
    await sb.from("settings").upsert({user_id:session.user.id,data:JSON.stringify(s)},{onConflict:"user_id"});
    setLastSync(new Date());
  };

  if(authLoading)return<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:15}}>Laden…</div>;
  if(!session)return<LoginScreen onLogin={s=>setSession(s)}/>;
  return<MainView session={session} entries={entries} adjustments={adjustments} settings={settings}
    syncing={syncing} lastSync={lastSync} onSaveEntry={saveEntry} onDeleteEntry={deleteEntry}
    onSaveAdjustments={saveAdjustments} onSaveSettings={saveSettings} onLogout={()=>sb.auth.signOut()}/>;
}

          <div style={{display:"flex",height:52,flexShrink:0}}>
            {[["kalender","📅"],["jahres","📊"],["einstellungen","⚙️"]].map(([v,l])=>(
              <button key={v} onClick={()=>setView(v)} style={{background:"none",border:"none",
                padding:"0 10px",height:52,fontSize:13,fontWeight:view===v?700:400,
                color:view===v?C.primaryText:C.muted,
                borderBottom:view===v?`2.5px solid ${C.primary}`:"2.5px solid transparent",transition:"all .15s"}}>
                {l}
              </button>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
            <button onClick={()=>setYear(y=>y-1)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:14}}>‹</button>
            <span style={{fontSize:12,minWidth:34,textAlign:"center",color:C.text,fontWeight:700}}>{year}</span>
            <button onClick={()=>setYear(y=>y+1)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:14}}>›</button>
            <button onClick={()=>setShowUser(s=>!s)} style={{background:C.bg,border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:13,marginLeft:2}}>👤</button>
          </div>
        </div>
      </div>

      {showUser&&(<>
        <div style={{position:"fixed",top:`calc(52px + env(safe-area-inset-top))`,right:12,
          background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",
          zIndex:300,minWidth:210,boxShadow:"0 8px 24px #1E293B20"}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:10}}>{session.user.email}</div>
          <button onClick={onLogout} style={{width:"100%",padding:"9px",background:C.redBg,
            border:`1px solid #FECACA`,borderRadius:9,color:C.red,fontSize:13,fontWeight:600}}>Abmelden</button>
        </div>
        <div style={{position:"fixed",inset:0,zIndex:299}} onClick={()=>setShowUser(false)}/>
      </>)}

      {/* ── KALENDER ── */}
      {view==="kalender"&&(
        <div className="fu" style={{maxWidth:900,margin:"0 auto",padding:"14px 11px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
          {/* Month strip */}
          <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto",paddingBottom:4}}>
            {MONTHS_SHORT.map((ms,i)=>{
              const md=monthlyData[i],active=i===month;
              return(<button key={ms} onClick={()=>setMonth(i)} style={{flex:"0 0 auto",padding:"5px 10px",borderRadius:9,fontSize:11,
                background:active?C.primaryLight:C.card,border:`1.5px solid ${active?C.primary:C.border}`,
                color:active?C.primaryText:C.muted,fontWeight:active?700:400,transition:"all .15s"}}>
                <div>{ms}</div>
                {md.overtime>0&&<div style={{fontSize:9,marginTop:1,color:C.green,fontWeight:700}}>+{fmtHAbs(md.overtime)}</div>}
              </button>);
            })}
          </div>

          {/* Month header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <h2 style={{fontSize:19,fontWeight:700,color:C.text}}>{MONTHS_LONG[month]} <span style={{color:C.faint,fontWeight:300}}>{year}</span></h2>
            <div style={{display:"flex",gap:14}}>
              {[{l:"Gearbeitet",v:fmtHAbs(cur.worked),c:C.primaryText},
                {l:"Überstunden",v:`+${fmtHAbs(cur.overtime)}`,c:C.green},
                ...(cur.paidExtra>0?[{l:"Ausgezahlt",v:fmtHAbs(cur.paidExtra),c:C.amber}]:[])
              ].map(s=>(
                <div key={s.l} style={{textAlign:"right"}}>
                  <div style={{fontSize:9,color:C.faint,fontWeight:600,marginBottom:1}}>{s.l.toUpperCase()}</div>
                  <div style={{fontSize:14,fontWeight:700,color:s.c}}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Day headers */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:3}}>
            {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10,color:C.faint,padding:"2px 0",fontWeight:600}}>{d}</div>
            ))}
          </div>

          {/* Weeks */}
          {(()=>{
            const cells=[
              ...Array.from({length:firstDow},(_,i)=>({empty:true,key:`e${i}`})),
              ...Array.from({length:daysInMonth},(_,i)=>({day:i+1})),
            ];
            while(cells.length%7!==0)cells.push({empty:true,key:`t${cells.length}`});
            const weeks=[];
            for(let w=0;w<cells.length/7;w++)weeks.push(cells.slice(w*7,w*7+7));
            return weeks.map((week,wi)=>{
              let wWorked=0,wPaid=0;
              week.forEach(c=>{
                if(!c.day)return;
                const e=getEntry(year,month,c.day);if(!e)return;
                const ch=computeHours(year,month,c.day,e,holidays,pct,shiftTimes);
                wWorked+=ch.net+ch.paidExtra;wPaid+=ch.paidExtra;
              });
              return(
                <div key={wi}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:2}}>
                    {week.map((cell,ci)=>{
                      if(cell.empty)return<div key={cell.key||`ec${wi}${ci}`}/>;
                      const d=cell.day,dow=new Date(year,month,d).getDay();
                      const we=dow===0||dow===6,hol=isHoliday(year,month,d,holidays);
                      const holEve=!hol&&isHolidayEve(year,month,d,holidays)&&!we;
                      const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
                      const entry=getEntry(year,month,d);
                      const shift=entry?SHIFTS[entry.shiftType]:null;
                      const ch=entry?computeHours(year,month,d,entry,holidays,pct,shiftTimes):null;
                      return(
                        <div key={d} className="dcell" onClick={()=>setModalDay({year,month,day:d})} style={{
                          minHeight:70,borderRadius:10,padding:"6px 5px",
                          background:shift?shift.bg:we||hol?"#F8FAFC":C.card,
                          border:isToday?`2px solid ${C.primary}`:shift?`1.5px solid ${shift.color}70`:`1px solid ${C.border}`,
                          boxShadow:isToday?`0 0 0 3px ${C.primary}18`:"0 1px 3px #1E293B07",
                          opacity:hol?0.65:1,
                        }}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                            <span style={{fontSize:11,fontWeight:isToday?700:400,
                              color:isToday?C.primaryText:hol?C.purple:we?C.faint:C.muted}}>{d}</span>
                            {holEve&&<span style={{fontSize:7,color:C.purple,fontWeight:700}}>VFT</span>}
                            {hol&&<span style={{fontSize:7,color:C.purple,fontWeight:700}}>FT</span>}
                          </div>
                          {shift&&!shift.isOnCall&&!shift.noTimer&&(<>
                            <div style={{fontSize:10,color:C.text,fontWeight:600,marginBottom:1}}>{shift.icon} {shift.label}</div>
                            {entry.endTime&&<div style={{fontSize:9,color:C.muted}}>{fmtTime(SHIFTS[entry.shiftType].getStart?.(isFridayLike(year,month,d,holidays))||{h:0,m:0})}–{fmtTime(entry.endTime)}</div>}
                            {ch?.overtime>0&&<div style={{fontSize:9,color:C.green,fontWeight:700}}>+{fmtHAbs(ch.overtime)}</div>}
                            {ch?.paidExtra>0&&<div style={{fontSize:8,color:C.amber,fontWeight:600}}>+{fmtHAbs(ch.paidExtra)} 💶</div>}
                          </>)}
                          {shift?.noTimer&&<div style={{fontSize:10,color:C.text,fontWeight:600}}>{shift.icon} {shift.label}</div>}
                          {shift?.isOnCall&&<div style={{fontSize:10,color:C.text,fontWeight:600}}>📞{entry.onCallActivationHours>0&&<span style={{color:C.amber}}> {entry.onCallActivationHours}h</span>}</div>}
                        </div>
                      );
                    })}
                  </div>
                  {wWorked>0&&(
                    <div style={{display:"flex",justifyContent:"flex-end",gap:12,padding:"3px 6px 8px",
                      borderBottom:`1px solid ${C.border}`,marginBottom:4,fontSize:10,color:C.muted}}>
                      <span>KW {getISOWeek(new Date(year,month,week.find(c=>c.day)?.day))}</span>
                      <span>Gearbeitet: <strong style={{color:C.primaryText}}>{fmtHAbs(wWorked)}</strong></span>
                      {wPaid>0&&<span>Ausgezahlt: <strong style={{color:C.amber}}>{fmtHAbs(wPaid)}</strong></span>}
                    </div>
                  )}
                </div>
              );
            });
          })()}

          {/* Legend */}
          <div style={{marginTop:14,display:"flex",flexWrap:"wrap",gap:8}}>
            {Object.entries(SHIFTS).map(([k,s])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.muted}}>
                <div style={{width:8,height:8,borderRadius:3,background:s.color}}/>{s.icon} {s.label}
              </div>
            ))}
            <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.muted}}>
              <span style={{color:C.purple,fontWeight:700,fontSize:9}}>FT</span> Feiertag (Bremen)
            </div>
          </div>
        </div>
      )}

      {/* ── JAHRESAUSWERTUNG ── */}
      {view==="jahres"&&(
        <div className="fu" style={{maxWidth:820,margin:"0 auto",padding:"14px 11px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            {[
              {l:"Gesamtüberstunden (alle Jahre)",v:`+${fmtHAbs(allYearsOvertime)}`,c:C.green,bg:C.greenBg,big:true},
              {l:`Überstunden ${year}`,v:`+${fmtHAbs(yearOvertime)}`,c:C.primaryText,bg:C.primaryLight,big:true},
              {l:"Gesamtarbeitszeit",v:fmtHAbs(yearWorked),c:C.text,bg:C.card},
              {l:"Abgebaut / Ausgezahlt",v:fmtHAbs(yearAdjTotal),c:C.amber,bg:C.amberBg},
              {l:"Sofort ausgezahlt",v:fmtHAbs(yearPaidExtra),c:C.amber,bg:C.amberBg},
              {l:"Eingetragene Dienste",v:Object.keys(entries).filter(k=>k.startsWith(String(year))).length+" Tage",c:C.muted,bg:C.card},
            ].map(card=>(
              <div key={card.l} style={{background:card.bg,borderRadius:13,padding:"14px 15px",border:`1px solid ${C.border}`,boxShadow:"0 1px 4px #1E293B08"}}>
                <div style={{fontSize:9,color:C.muted,fontWeight:600,marginBottom:5,letterSpacing:.4}}>{card.l.toUpperCase()}</div>
                <div style={{fontSize:card.big?22:16,fontWeight:700,color:card.c}}>{card.v}</div>
              </div>
            ))}
          </div>

          {/* Bar chart */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:13,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px #1E293B08"}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:600,letterSpacing:.4,marginBottom:12}}>ÜBERSTUNDEN PRO MONAT {year}</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:3,height:80}}>
              {monthlyData.map((md,i)=>{
                const mx=Math.max(...monthlyData.map(m=>m.overtime),1),p2=md.overtime/mx,has=md.overtime>0;
                return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  {has&&<div style={{fontSize:7,color:C.green,fontWeight:700}}>{fmtHAbs(md.overtime)}</div>}
                  <div style={{width:"100%",height:`${Math.max(p2*56,has?3:1)}px`,
                    background:has?C.green:C.border,borderRadius:"4px 4px 0 0",transition:"height .4s"}}/>
                  <div style={{fontSize:9,color:i===month?C.primaryText:C.faint,fontWeight:i===month?700:400}}>{MONTHS_SHORT[i]}</div>
                </div>);
              })}
            </div>
          </div>

          {/* Monthly table */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:13,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px #1E293B08"}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:600,letterSpacing:.4,marginBottom:10}}>MONATSÜBERSICHT {year}</div>
            <div style={{display:"grid",gridTemplateColumns:"55px 1fr 1fr 1fr"}}>
              {["MONAT","GEARBEITET","ÜBERSTD.","AUSGEZ."].map(h=>(
                <div key={h} style={{fontSize:9,color:C.faint,fontWeight:600,padding:"4px 6px",borderBottom:`1px solid ${C.border}`}}>{h}</div>
              ))}
              {monthlyData.map((md,i)=>[
                <div key={`m${i}`} style={{fontSize:12,padding:"7px 6px",borderBottom:`1px solid ${C.bg}`,fontWeight:i===month?700:400,color:i===month?C.primaryText:C.text}}>{MONTHS_SHORT[i]}</div>,
                <div key={`w${i}`} style={{fontSize:12,padding:"7px 6px",borderBottom:`1px solid ${C.bg}`,color:C.muted}}>{md.worked>0?fmtHAbs(md.worked):"–"}</div>,
                <div key={`d${i}`} style={{fontSize:12,padding:"7px 6px",borderBottom:`1px solid ${C.bg}`,color:md.overtime>0?C.green:C.faint,fontWeight:md.overtime>0?700:400}}>{md.overtime>0?`+${fmtHAbs(md.overtime)}`:"–"}</div>,
                <div key={`p${i}`} style={{fontSize:12,padding:"7px 6px",borderBottom:`1px solid ${C.bg}`,color:md.paidExtra>0?C.amber:C.faint}}>{md.paidExtra>0?fmtHAbs(md.paidExtra):"–"}</div>,
              ])}
            </div>
          </div>

          {/* Adjustments */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:13,padding:"16px",boxShadow:"0 1px 4px #1E293B08"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <div style={{fontSize:10,color:C.muted,fontWeight:600,letterSpacing:.4}}>ABBUCHUNGEN {year}</div>
              <button onClick={()=>{setAdjForm({date:`${year}-01-01`,hours:"",type:"abgefeiert",note:""});setAdjModal(true);}}
                style={{background:C.primaryLight,border:`1px solid ${C.primary}`,color:C.primaryText,borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600}}>+ Eintrag</button>
            </div>
            {yearAdj.length===0&&<div style={{color:C.faint,fontSize:13,textAlign:"center",padding:"14px 0"}}>Keine Abbuchungen für {year}</div>}
            {yearAdj.map((a,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 4px",borderRadius:8}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:a.type==="abgefeiert"?C.green:C.amber,flexShrink:0}}/>
                <div style={{fontSize:11,color:C.muted,minWidth:80}}>{new Date(a.date).toLocaleDateString("de-DE")}</div>
                <div style={{flex:1,fontSize:12}}>{a.note||"–"}</div>
                <div style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:20,
                  color:a.type==="abgefeiert"?C.green:C.amber,background:a.type==="abgefeiert"?C.greenBg:C.amberBg}}>
                  {a.type==="abgefeiert"?"Abgefeiert":"Ausgezahlt"}
                </div>
                <div style={{fontSize:11,color:C.red,fontWeight:600,minWidth:48,textAlign:"right"}}>-{fmtHAbs(a.hours)}</div>
                <button onClick={()=>onSaveAdjustments(adjustments.filter((_,j)=>j!==adjustments.indexOf(a)))}
                  style={{background:"none",border:"none",color:C.faint,fontSize:18,lineHeight:1}}>×</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── EINSTELLUNGEN ── */}
      {view==="einstellungen"&&(
        <SettingsView settings={settings} onSave={onSaveSettings}/>
      )}

      {modalDay&&<DayModal day={modalDay} holidays={holidays}
        entry={getEntry(modalDay.year,modalDay.month,modalDay.day)}
        pct={pct} shiftTimes={shiftTimes} SHIFTS={SHIFTS}
        onSave={data=>{onSaveEntry(dateKey(modalDay.year,modalDay.month,modalDay.day),data);setModalDay(null);}}
        onDelete={()=>{onDeleteEntry(dateKey(modalDay.year,modalDay.month,modalDay.day));setModalDay(null);}}
        onClose={()=>setModalDay(null)}/>}

      {adjModal&&<AdjModal form={adjForm} onChange={setAdjForm}
        onSave={()=>{if(!adjForm.hours||isNaN(+adjForm.hours))return;
          onSaveAdjustments([...adjustments,{...adjForm,hours:+adjForm.hours}]);setAdjModal(false);}}
        onClose={()=>setAdjModal(false)}/>}
    </div>
  );
}

// ── Settings View ─────────────────────────────────────────────────────────────
function SettingsView({settings,onSave}){
  const[pct,setPct]=useState(settings.contractPct||100);
  const[times,setTimes]=useState(settings.shiftTimes||{});
  const[saved,setSaved]=useState(false);
  const[openShift,setOpenShift]=useState(null);

  const save=async()=>{
    await onSave({contractPct:Number(pct),shiftTimes:times});
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  };

  const updateTime=(key,field,val)=>{
    setTimes(p=>{const def=DEFAULT_SHIFT_TIMES[key]||{};return{...p,[key]:{...def,...(p[key]||{}),[field]:Number(val)}};});
  };

  const editableKeys=["TAGDIENST","LANGER_DIENST","LANGER_DIENST_WE","VISITENDIENST","SPAETDIENST"];
  const SHIFTS=buildShifts(times);

  const card={background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px",marginBottom:14,boxShadow:"0 1px 4px #1E293B08"};

  return(
    <div className="fu" style={{maxWidth:580,margin:"0 auto",padding:"14px 11px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
      <h2 style={{fontSize:18,fontWeight:700,color:C.text,marginBottom:14}}>Einstellungen</h2>

      {/* Contract % */}
      <div style={card}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:.4,marginBottom:12}}>STELLENUMFANG</div>
        <div style={{fontSize:13,color:C.text,marginBottom:10}}>Wie viel Prozent beträgt dein Vertrag?</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
          {[100,90,80,75,60,50].map(p=>(
            <button key={p} onClick={()=>setPct(p)} style={{padding:"8px 14px",borderRadius:9,fontSize:13,fontWeight:600,
              background:pct===p?C.primaryLight:C.bg,border:`1.5px solid ${pct===p?C.primary:C.border}`,
              color:pct===p?C.primaryText:C.muted,transition:"all .15s"}}>{p}%</button>
          ))}
          <input type="number" min={10} max={100} value={pct} onChange={e=>setPct(e.target.value)}
            style={{width:68,padding:"8px",borderRadius:9,border:`1.5px solid ${C.border}`,
              background:C.bg,fontSize:13,color:C.text,textAlign:"center"}}/>
        </div>
        <div style={{background:C.primaryLight,borderRadius:9,padding:"10px 13px",fontSize:12,color:C.primaryText,lineHeight:1.7}}>
          <strong>Bei {pct}% Stelle:</strong><br/>
          Tagessoll Mo–Do: <strong>{fmtHAbs(8.5*pct/100)}</strong> &nbsp;·&nbsp; Fr/VFT: <strong>{fmtHAbs(8.0*pct/100)}</strong>
        </div>
      </div>

      {/* Shift times */}
      <div style={card}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:.4,marginBottom:4}}>DIENSTZEITEN ANPASSEN</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Tippe auf einen Dienst um die Zeiten zu ändern.</div>
        {editableKeys.map(k=>{
          const s=SHIFTS[k];
          const def=DEFAULT_SHIFT_TIMES[k]||{};
          const cur={...def,...(times[k]||{})};
          const isOpen=openShift===k;
          return(<div key={k} style={{marginBottom:8,border:`1.5px solid ${isOpen?s.color:C.border}`,borderRadius:11,overflow:"hidden"}}>
            <button onClick={()=>setOpenShift(isOpen?null:k)}
              style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"11px 14px",background:isOpen?s.bg:C.bg,border:"none",textAlign:"left"}}>
              <span style={{fontSize:13,fontWeight:600,color:C.text}}>{s.icon} {s.label}</span>
              <span style={{fontSize:11,color:C.muted}}>{isOpen?"▲":"▼"}</span>
            </button>
            {isOpen&&(
              <div style={{padding:"12px 14px",background:s.bg,borderTop:`1px solid ${s.color}30`}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,fontSize:12}}>
                  {k==="TAGDIENST"&&(<>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>START</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>ENDE Mo–Do</div>
                      <TI h={cur.endH} m={cur.endM} onH={v=>updateTime(k,"endH",v)} onM={v=>updateTime(k,"endM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>ENDE Fr / VFT</div>
                      <TI h={cur.endFriH} m={cur.endFriM} onH={v=>updateTime(k,"endFriH",v)} onM={v=>updateTime(k,"endFriM",v)}/></div>
                  </>)}
                  {k==="LANGER_DIENST"&&(<>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>START Mo–Do</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>ENDE Mo–Do</div>
                      <TI h={cur.endH} m={cur.endM} onH={v=>updateTime(k,"endH",v)} onM={v=>updateTime(k,"endM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>START Fr / VFT</div>
                      <TI h={cur.startFriH} m={cur.startFriM} onH={v=>updateTime(k,"startFriH",v)} onM={v=>updateTime(k,"startFriM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>ENDE Fr / VFT</div>
                      <TI h={cur.endFriH} m={cur.endFriM} onH={v=>updateTime(k,"endFriH",v)} onM={v=>updateTime(k,"endFriM",v)}/></div>
                  </>)}
                  {k==="LANGER_DIENST_WE"&&(<>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>START</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>ENDE</div>
                      <TI h={cur.endH} m={cur.endM} onH={v=>updateTime(k,"endH",v)} onM={v=>updateTime(k,"endM",v)}/></div>
                  </>)}
                  {(k==="VISITENDIENST"||k==="SPAETDIENST")&&(<>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>START</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:600,marginBottom:5}}>PFLICHTENDE</div>
                      <TI h={cur.fixedEndH} m={cur.fixedEndM} onH={v=>updateTime(k,"fixedEndH",v)} onM={v=>updateTime(k,"fixedEndM",v)}/></div>
                  </>)}
                </div>
                <button onClick={()=>setTimes(p=>{const n={...p};delete n[k];return n;})}
                  style={{marginTop:10,fontSize:11,color:C.muted,background:"none",border:`1px solid ${C.border}`,borderRadius:7,padding:"4px 10px"}}>
                  Zurücksetzen
                </button>
              </div>
            )}
          </div>);
        })}
      </div>

      <button onClick={save} style={{width:"100%",padding:"14px",background:saved?C.green:C.primary,border:"none",
        borderRadius:13,color:"#fff",fontSize:15,fontWeight:700,boxShadow:`0 4px 14px ${C.primary}40`,transition:"background .3s"}}>
        {saved?"✓ Gespeichert!":"Einstellungen speichern"}
      </button>
    </div>
  );
}

function TI({h,m,onH,onM}){
  const s={width:52,padding:"7px 4px",borderRadius:8,border:`1.5px solid ${C.border}`,background:C.card,fontSize:15,fontWeight:700,textAlign:"center",color:C.text};
  return(<div style={{display:"flex",alignItems:"center",gap:4}}>
    <input type="number" min={0} max={23} value={pad(h||0)} onChange={e=>onH(e.target.value)} style={s}/>
    <span style={{color:C.muted,fontWeight:700}}>:</span>
    <input type="number" min={0} max={59} value={pad(m||0)} onChange={e=>onM(e.target.value)} style={s}/>
  </div>);
}

// ── Day Modal ─────────────────────────────────────────────────────────────────
function DayModal({day,entry,holidays,pct,shiftTimes,SHIFTS,onSave,onDelete,onClose}){
  const{year,month,day:d}=day;
  const dow=new Date(year,month,d).getDay();
  const we=dow===0||dow===6,hol=isHoliday(year,month,d,holidays),fri=isFridayLike(year,month,d,holidays);
  const[shiftType,setShiftType]=useState(entry?.shiftType||(we?"LANGER_DIENST_WE":"TAGDIENST"));
  const[endH,setEndH]=useState(entry?.endTime?.h??"");
  const[endM,setEndM]=useState(entry?.endTime?.m??"");
  const[onCallH,setOnCallH]=useState(entry?.onCallActivationHours??"");
  const[note,setNote]=useState(entry?.note||"");

  const shift=SHIFTS[shiftType];
  const startT=shift?.getStart?.(fri);
  const fixedEnd=shift?.fixedEnd?.();
  const defaultEnd=fixedEnd||shift?.getEnd?.(fri);
  const endTime=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;

  let preview=null;
  if(startT&&endTime&&!shift?.noTimer&&!shift?.isOnCall){
    let gm=toMin(endTime)-toMin(startT);if(gm<0)gm+=24*60;
    const bm=calcBreak(gm),nh=(gm-bm)/60;
    const soll=getDailySoll(year,month,d,holidays,pct);
    let pe=0;
    if(shift.hasPaidExtra&&fixedEnd){const et=toMin(endTime),ft=toMin(fixedEnd);if(et>ft)pe=(et-ft)/60;}
    else if(shift.paidExtraAfterSoll){const ov=nh-soll;if(ov>0)pe=ov;}
    const ot=shift.paidExtraAfterSoll?0:Math.max(0,nh-pe-soll);
    preview={net:nh-pe,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
  }

  const available=Object.entries(SHIFTS).filter(([k,s])=>!(s.weekendOnly&&!we)&&!(k==="LANGER_DIENST_WE"&&!we));
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"11px 13px",fontSize:13,color:C.text,fontFamily:"inherit"};

  return(
    <div style={{position:"fixed",inset:0,background:"#1E293B50",display:"flex",alignItems:"flex-end",
      justifyContent:"center",zIndex:200,backdropFilter:"blur(3px)"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:C.card,borderRadius:"22px 22px 0 0",padding:"18px 18px",
        width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",
        paddingBottom:"max(20px,env(safe-area-inset-bottom))"}}>
        <div style={{width:40,height:4,background:C.border,borderRadius:2,margin:"0 auto 16px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:2}}>{DOW_LONG[dow].toUpperCase()}, {d}. {MONTHS_LONG[month]} {year}</div>
            {hol&&<div style={{fontSize:11,color:C.purple,fontWeight:600}}>🎌 Feiertag (Bremen)</div>}
            {!hol&&fri&&dow!==5&&<div style={{fontSize:11,color:C.purple,fontWeight:600}}>⚡ Vortag Feiertag – wie Freitag gewertet</div>}
          </div>
          <button onClick={onClose} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,width:32,height:32,fontSize:17,color:C.muted}}>×</button>
        </div>

        {/* Shift selector */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>DIENSTFORM</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {available.map(([k,s])=>(
              <button key={k} onClick={()=>setShiftType(k)} style={{padding:"9px 10px",borderRadius:11,textAlign:"left",
                fontSize:12,fontWeight:600,transition:"all .15s",
                background:shiftType===k?s.bg:C.bg,
                border:`1.5px solid ${shiftType===k?s.color:C.border}`,
                color:shiftType===k?C.text:C.muted}}>
                {s.icon} {s.label}
              </button>
            ))}
          </div>
        </div>

        {/* Shift info bar */}
        {startT&&(
          <div style={{background:C.bg,borderRadius:10,padding:"9px 12px",marginBottom:12,fontSize:12}}>
            <div style={{color:C.muted}}>
              Start: <strong style={{color:C.text}}>{fmtTime(startT)}</strong>
              {fixedEnd&&<> · Pflichtende: <strong style={{color:C.text}}>{fmtTime(fixedEnd)}</strong></>}
              {!fixedEnd&&defaultEnd&&<> · Planende: <strong style={{color:C.muted}}>{fmtTime(defaultEnd)}</strong></>}
            </div>
            {shift?.hasOnCall&&<div style={{color:C.purple,marginTop:3,fontWeight:600}}>📞 Rufbereitschaft nach Dienstende</div>}
            {shift?.hasPaidExtra&&<div style={{color:C.amber,marginTop:3,fontWeight:600}}>💶 Überstunden werden sofort ausgezahlt</div>}
          </div>
        )}

        {/* End time */}
        {!shift?.noTimer&&!shift?.isOnCall&&(
          <div style={{marginBottom:13}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>
              {shift?.hasPaidExtra?"TATSÄCHLICHE ENDZEIT":"ENDZEIT (leer = Planende)"}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="number" min={0} max={23} value={endH} onChange={e=>setEndH(e.target.value)}
                placeholder={defaultEnd?pad(defaultEnd.h):"hh"}
                style={{width:68,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,
                  padding:"11px 8px",fontSize:20,fontWeight:700,color:C.text,textAlign:"center"}}/>
              <span style={{fontSize:22,color:C.muted,fontWeight:700}}>:</span>
              <input type="number" min={0} max={59} value={endM} onChange={e=>setEndM(e.target.value)}
                placeholder={defaultEnd?pad(defaultEnd.m):"mm"}
                style={{width:68,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,
                  padding:"11px 8px",fontSize:20,fontWeight:700,color:C.text,textAlign:"center"}}/>
              <span style={{fontSize:13,color:C.muted}}>Uhr</span>
              {(endH!==""||endM!=="")&&<button onClick={()=>{setEndH("");setEndM("");}}
                style={{background:"none",border:"none",color:C.faint,fontSize:20}}>↺</button>}
            </div>
          </div>
        )}

        {shift?.isOnCall&&(
          <div style={{marginBottom:13}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>AKTIVIERUNGSSTUNDEN (ausgezahlt, kein Saldo)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="z.B. 1.5" style={inp}/>
          </div>
        )}

        {shift?.hasOnCall&&!shift?.isOnCall&&(
          <div style={{marginBottom:13}}>
            <div style={{fontSize:11,color:C.purple,fontWeight:600,marginBottom:8}}>📞 RUFBEREITSCHAFT – AKTIVIERUNGSSTUNDEN (ausgezahlt)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="Einsatzstunden (optional)" style={inp}/>
          </div>
        )}

        {/* Preview */}
        {preview&&(
          <div style={{background:C.bg,borderRadius:11,padding:"12px 13px",marginBottom:14}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:8}}>VORSCHAU</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
              {[["BRUTTO",fmtHAbs(preview.gross)],["PAUSE",`${preview.breakMin}min`],["NETTO",fmtHAbs(preview.net)]].map(([l,v])=>(
                <div key={l}><div style={{fontSize:9,color:C.faint,fontWeight:600}}>{l}</div>
                  <div style={{fontSize:14,fontWeight:700,color:C.text}}>{v}</div></div>
              ))}
            </div>
            {preview.paidExtra>0&&<div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:5}}>💶 Sofort ausgezahlt: {fmtHAbs(preview.paidExtra)}</div>}
            <div style={{fontSize:13,fontWeight:700}}>
              {preview.overtime>0?<span style={{color:C.green}}>+{fmtHAbs(preview.overtime)} Überstunden</span>
                :preview.paidExtra>0?<span style={{color:C.amber}}>Überstunden direkt ausgezahlt</span>
                :<span style={{color:C.muted}}>Keine Überstunden</span>}
              <span style={{color:C.faint,marginLeft:8,fontWeight:400,fontSize:11}}>Soll: {fmtHAbs(preview.soll)}</span>
            </div>
          </div>
        )}

        {/* Note */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>NOTIZ (optional)</div>
          <input type="text" value={note} onChange={e=>setNote(e.target.value)}
            placeholder="Station, Einsatz, Bemerkung..." style={inp}/>
        </div>

        <div style={{display:"flex",gap:8}}>
          {entry&&<button onClick={onDelete}
            style={{padding:"12px 16px",background:C.redBg,border:`1px solid #FECACA`,borderRadius:12,color:C.red,fontSize:13,fontWeight:700}}>
            Löschen
          </button>}
          <button onClick={()=>{
            const et=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;
            onSave({shiftType,endTime:et,onCallActivationHours:onCallH!==""?+onCallH:0,note});
          }} style={{flex:1,padding:"13px",background:C.primary,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:700,boxShadow:`0 4px 14px ${C.primary}40`}}>
            Speichern
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Adj Modal ─────────────────────────────────────────────────────────────────
function AdjModal({form,onChange,onSave,onClose}){
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"11px 13px",color:C.text,fontSize:13,fontFamily:"inherit"};
  return(
    <div style={{position:"fixed",inset:0,background:"#1E293B50",display:"flex",alignItems:"flex-end",
      justifyContent:"center",zIndex:200,backdropFilter:"blur(3px)"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:C.card,borderRadius:"22px 22px 0 0",padding:"18px 18px",
        width:"100%",maxWidth:520,paddingBottom:"max(20px,env(safe-area-inset-bottom))"}}>
        <div style={{width:40,height:4,background:C.border,borderRadius:2,margin:"0 auto 16px"}}/>
        <div style={{fontSize:17,fontWeight:700,color:C.text,marginBottom:16}}>Überstunden abbuchen</div>
        {[{l:"DATUM",f:"date",t:"date"},{l:"STUNDEN",f:"hours",t:"number",pl:"z.B. 8"},{l:"NOTIZ",f:"note",t:"text",pl:"z.B. Freizeitausgleich KW 12"}].map(field=>(
          <div key={field.f} style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>{field.l}</div>
            <input type={field.t} value={form[field.f]} placeholder={field.pl} step={field.t==="number"?"0.5":undefined}
              onChange={e=>onChange(p=>({...p,[field.f]:e.target.value}))} style={inp}/>
          </div>
        ))}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>TYP</div>
          <div style={{display:"flex",gap:8}}>
            {[["abgefeiert","Abgefeiert 🟢",C.green,C.greenBg],["ausgezahlt","Ausgezahlt 🟡",C.amber,C.amberBg]].map(([v,l,col,bg])=>(
              <button key={v} onClick={()=>onChange(p=>({...p,type:v}))} style={{flex:1,padding:"11px",borderRadius:11,fontSize:13,fontWeight:600,
                background:form.type===v?bg:C.bg,border:`1.5px solid ${form.type===v?col:C.border}`,
                color:form.type===v?col:C.muted}}>{l}</button>
            ))}
          </div>
        </div>
        <button onClick={onSave} style={{width:"100%",padding:"13px",background:C.primary,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:700}}>Speichern</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
