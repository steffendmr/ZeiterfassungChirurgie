// ── Bremen Holidays ────────────────────────────────────────────────────────────
function getBremenHolidays(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m2=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m2+114)/31)-1,dy=((h+l-7*m2+114)%31)+1;
  const ea=new Date(year,mo,dy);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([`${year}-01-01`,fmt(add(ea,-2)),fmt(ea),fmt(add(ea,1)),`${year}-05-01`,
    fmt(add(ea,39)),fmt(add(ea,49)),fmt(add(ea,50)),`${year}-10-03`,`${year}-10-31`,`${year}-12-25`,`${year}-12-26`]);
}
function dateKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isHolidayEve(y,m,d,hols){const nx=new Date(y,m,d+1);return hols.has(dateKey(nx.getFullYear(),nx.getMonth(),nx.getDate()));}
function isFridayLike(y,m,d,hols){return new Date(y,m,d).getDay()===5||isHolidayEve(y,m,d,hols);}
function isWeekend(y,m,d){const dw=new Date(y,m,d).getDay();return dw===0||dw===6;}
function isHoliday(y,m,d,hols){return hols.has(dateKey(y,m,d));}
function getISOWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);}

// ── Soll & Break ───────────────────────────────────────────────────────────────
// Tagdienst Fr: 7:00–15:30 → 8.5h brutto, 30min Pause → 8h netto (= Soll Fr)
// Wenn länger gearbeitet (>9.5h) → 45min Pause (bereits in calcBreak)
// Soll Mo–Do: 8.0h, Fr: 8.0h (Tagdienst Fr hat genau 8h netto = Soll)
// ABER: BASE_FRI für Soll-Berechnung bleibt 7.5h (Vertragsgrundlage)
// Der Tagdienst Fr geht 8.5h brutto – 30min = 8h net, Soll = 7.5h → 0.5h ÜS
// Korrektur: Soll Fr = 7.5h lt. Vertrag, aber Tagdienst Fr endet 15:30 (8.5h brutto, 30min → 8h netto)
// d.h. jeder reguläre Tagdienst Fr bringt 0.5h Überstunden
const BASE_MON_THU=8.0, BASE_FRI=7.5;

function getEffectivePct(y,m,d,settings){
  const pct=settings.contractPct||100;
  const startDate=settings.partTimeStart;
  if(!startDate)return pct;
  const entryDate=new Date(y,m,d);
  const start=new Date(startDate);
  return entryDate>=start?pct:100;
}

function getDailySoll(y,m,d,hols,settings){
  if(isWeekend(y,m,d)||isHoliday(y,m,d,hols))return 0;
  const pct=getEffectivePct(y,m,d,settings);
  const partTimeMode=settings.partTimeMode||"none";
  const fixedDayOff=settings.fixedDayOff;
  if(partTimeMode==="fixedDay"&&fixedDayOff){
    const dow=new Date(y,m,d).getDay();
    if(dow===Number(fixedDayOff))return 0;
  }
  const base=isFridayLike(y,m,d,hols)?BASE_FRI:BASE_MON_THU;
  return base*(pct/100);
}

// Break: >9.5h gross → 45min, else 30min
function calcBreak(grossMin){
  return grossMin>9.5*60?45:30;
}

// Friday Tagdienst: brutto = 8.5h (7:00–15:30), Pause 30min → netto 8h
// Falls man länger bleibt (>9.5h), kommt 45min Pause → zusätzlich 15min abgezogen
// Diese Logik ist bereits in calcBreak: >570min (9.5h) → 45min
// Bei Freitag Tagdienst bis 17:30: 10.5h brutto → >9.5h → 45min Pause
// Netto: 10.5 - 0.75 = 9.75h; Soll: 7.5h; ÜS: 9.75 - 7.5 = 2.25h? 
// NEIN: Soll Fr = 7.5h, Netto 9.75h → ÜS = 2.25h. 
// Aber User sagt: bis 17:30 → 1h45min ÜS → 2 ÜS nach Rundung... und 15min extra Pause abgezogen.
// Bei 15:30 als Planende: Brutto = 10.5h (7–17:30), >9.5h → 45min statt 30min → 15min mehr abgezogen
// Netto = 10.5 - 0.75 = 9.75h; Soll Fr = 7.5h; ÜS = 2.25h ≈ 2h15min
// User: "bis 17:30 sind es 1h45min" → scheinbar meint er ab 15:30 → 2h extra, minus 15min Pause = 1h45min
// Das passt: reguläre Zeit 7:00–15:30 = 8.5h brutto = 8h netto. Dann 15:30–17:30 = 2h extra.
// Davon 15min Pausenkorrektur (45min statt 30min) abziehen → 1h45min ÜS. ✓
// Der Code berechnet genau das bereits korrekt durch calcBreak!

const pad=n=>String(n).padStart(2,"0");
const toMin=t=>t.h*60+t.m;
const fmtTime=t=>`${pad(t.h)}:${pad(t.m)}`;
const fmtHAbs=h=>{const a=Math.abs(h),hh=Math.floor(a),mm=Math.round((a-hh)*60);return`${hh}h${mm>0?" "+mm+"m":""}`;};

const MONTHS_LONG=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_SHORT=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DOW_LONG=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const DOW_NAMES=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function computeHours(y,m,d,entry,hols,settings,shiftTimes){
  const soll=getDailySoll(y,m,d,hols,settings);
  if(!entry)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  const SHIFTS=buildShifts(shiftTimes);
  const shift=SHIFTS[entry.shiftType];
  if(!shift)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  if(shift.isOnCall)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0,onCallHours:entry.onCallActivationHours||0};
  // Überstundenfrei: bucht Netto-Soll als "abgefeiert" ab
  if(shift.isUeberstundenfrei){
    return{net:soll,soll,gross:soll,breakMin:0,paidExtra:0,overtime:0,isUeberstundenfrei:true};
  }
  if(shift.noTimer){const n=shift.noSoll?0:soll;return{net:n,soll,gross:n,breakMin:0,paidExtra:0,overtime:0};}
  const fri=isFridayLike(y,m,d,hols);
  const startT=shift.getStart(fri);
  const fixedEnd=shift.fixedEnd?shift.fixedEnd():null;
  const endT=entry.endTime||shift.getEnd?.(fri)||fixedEnd;
  if(!startT||!endT)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  let gm=toMin(endT)-toMin(startT);if(gm<0)gm+=24*60;
  const bm=calcBreak(gm),nh=(gm-bm)/60;

  if(shift.allPaid){
    return{net:0,soll,gross:gm/60,breakMin:bm,paidExtra:nh,overtime:0};
  }

  let pe=0;
  if(shift.hasPaidExtra&&fixedEnd&&!shift.allPaid){
    const fe=toMin(fixedEnd),ee=toMin(endT);if(ee>fe)pe=(ee-fe)/60;
  } else if(shift.paidExtraAfterSoll){
    const ov=nh-soll;if(ov>0)pe=ov;
  }
  const nfs=nh-pe;
  const ot=shift.paidExtraAfterSoll?0:Math.max(0,nfs-soll);
  return{net:nfs,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
}

// ── Login ──────────────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[mode,setMode]=useState("login");
  const handle=async()=>{
    setLoading(true);setError("");
    try{
      const res=mode==="login"
        ?await sb.auth.signInWithPassword({email,password})
        :await sb.auth.signUp({email,password});
      if(res.error)throw res.error;
      if(mode==="register"&&!res.data.session){setError("Bitte E-Mail bestätigen, dann einloggen.");setMode("login");}
      else onLogin(res.data.session);
    }catch(e){setError(e.message||"Fehler");}
    setLoading(false);

  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(135deg,#FDE8D0 0%,#FDDCC4 50%,#FCD0A8 100%)`,display:"flex",alignItems:"center",justifyContent:"center",padding:"env(safe-area-inset-top) 20px 20px"}}>

        </div>
        <div style={{background:C.card,borderRadius:20,padding:24,boxShadow:"0 8px 32px #C04E0E20",border:`1.5px solid ${C.border}`}}>
          <div style={{fontSize:15,color:C.text,marginBottom:18,fontWeight:700}}>{mode==="login"?"Anmelden":"Konto erstellen"}</div>
          {[["E-Mail","email",email,setEmail],["Passwort","password",password,setPassword]].map(([l,t,v,sv])=>(
            <div key={l} style={{marginBottom:12}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:5}}>{l.toUpperCase()}</div>
              <input type={t} value={v} onChange={e=>sv(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}

                style={{width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"11px 14px",fontSize:14,color:C.text,outline:"none",fontFamily:"inherit"}}/>
            </div>
          ))}
          {error&&<div style={{fontSize:12,color:C.red,marginBottom:12,padding:"8px 12px",background:C.redBg,borderRadius:8,fontWeight:500}}>{error}</div>}
          <button onClick={handle} disabled={loading}
            style={{width:"100%",padding:"13px",background:`linear-gradient(135deg,${C.primary},#C04E0E)`,border:"none",borderRadius:11,color:"#fff",fontSize:15,fontWeight:700,boxShadow:`0 4px 14px ${C.primary}50`,opacity:loading?0.7:1}}>
            {loading?"…":mode==="login"?"Anmelden":"Konto erstellen"}
          </button>
          <div style={{textAlign:"center",marginTop:14,fontSize:12,color:C.muted}}>
            {mode==="login"?"Noch kein Konto? ":"Schon registriert? "}
            <button onClick={()=>{setMode(mode==="login"?"register":"login");setError("");}}

// ── Root App ───────────────────────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[entries,setEntries]=useState({});
  const[adjustments,setAdjustments]=useState([]);
  const[settings,setSettings]=useState({contractPct:100,shiftTimes:{},partTimeMode:"none",fixedDayOff:null,partTimeStart:null,overtimeCarryover:0,overtimeCarryoverDate:null});
  const[syncing,setSyncing]=useState(false);
  const[lastSync,setLastSync]=useState(null);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{if(session)loadData();},[session]);

  const loadData=async()=>{
    setSyncing(true);
    try{
      const uid=session.user.id;
      const[eR,aR,sR]=await Promise.all([
        sb.from("entries").select("*").eq("user_id",uid),
        sb.from("adjustments").select("*").eq("user_id",uid),
        sb.from("settings").select("*").eq("user_id",uid).maybeSingle(),
      ]);
      if(eR.data){const map={};eR.data.forEach(r=>{map[r.date_key]=JSON.parse(r.data);});setEntries(map);}
      if(aR.data)setAdjustments(aR.data.map(r=>JSON.parse(r.data)));
      if(sR.data)setSettings(s=>({...s,...JSON.parse(sR.data.data)}));
      setLastSync(new Date());
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  const saveEntry=async(key,data)=>{
    setEntries(p=>({...p,[key]:data}));
    await sb.from("entries").upsert({user_id:session.user.id,date_key:key,data:JSON.stringify(data)},{onConflict:"user_id,date_key"});
    setLastSync(new Date());
  };
  const deleteEntry=async(key)=>{
    setEntries(p=>{const n={...p};delete n[key];return n;});
    await sb.from("entries").delete().eq("user_id",session.user.id).eq("date_key",key);
    setLastSync(new Date());
  };
  const saveAdjustments=async(adjs)=>{
    setAdjustments(adjs);
    const uid=session.user.id;
    await sb.from("adjustments").delete().eq("user_id",uid);
    if(adjs.length>0)await sb.from("adjustments").insert(adjs.map((a,i)=>({user_id:uid,idx:i,data:JSON.stringify(a)})));
    setLastSync(new Date());
  };
  const saveSettings=async(s)=>{
    setSettings(s);
    await sb.from("settings").upsert({user_id:session.user.id,data:JSON.stringify(s)},{onConflict:"user_id"});
    setLastSync(new Date());
  };

  if(authLoading)return<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:15}}>Laden…</div>;
  if(!session)return<LoginScreen onLogin={s=>setSession(s)}/>;
  return<MainView session={session} entries={entries} adjustments={adjustments} settings={settings}
    syncing={syncing} lastSync={lastSync} onSaveEntry={saveEntry} onDeleteEntry={deleteEntry}
    onSaveAdjustments={saveAdjustments} onSaveSettings={saveSettings} onLogout={()=>sb.auth.signOut()}/>;
}

// ── Excel Export ───────────────────────────────────────────────────────────────
function exportToExcel(entries,adjustments,settings){
  const shiftTimes=settings.shiftTimes||{};
  const today=new Date();
  // Alle Keys sortieren
  const allKeys=Object.keys(entries).sort();
  if(allKeys.length===0){alert("Keine Einträge zum Exportieren.");return;}
  
  const rows=[["Datum","Wochentag","Dienstform","Start","Ende","Brutto","Pause","Netto","Soll","Überstunden","Sofort ausgezahlt","Notiz"]];
  
  allKeys.forEach(key=>{
    const[ys,ms,ds]=key.split("-").map(Number);
    const y=ys,m=ms-1,d=ds;
    const hols=getBremenHolidays(y);
    const entry=entries[key];
    const ch=computeHours(y,m,d,entry,hols,settings,shiftTimes);
    const SHIFTS=buildShifts(shiftTimes);
    const shift=SHIFTS[entry.shiftType]||{label:entry.shiftType};
    const dow=new Date(y,m,d).getDay();
    const fri=isFridayLike(y,m,d,hols);
    let startStr="",endStr="";
    if(!shift.isOnCall&&!shift.noTimer&&!shift.isUeberstundenfrei){
      const st=shift.getStart?.(fri);
      const et=entry.endTime||shift.getEnd?.(fri)||shift.fixedEnd?.();
      if(st)startStr=fmtTime(st);
      if(et)endStr=fmtTime(et);
    }
    const dateStr=`${String(d).padStart(2,"0")}.${String(m+1).padStart(2,"0")}.${y}`;
    rows.push([
      dateStr,
      DOW_LONG[dow],
      shift.label||entry.shiftType,
      startStr,endStr,
      ch.gross>0?fmtHAbs(ch.gross):"",
      ch.breakMin>0?`${ch.breakMin}min`:"",
      ch.net>0?fmtHAbs(ch.net):"",
      ch.soll>0?fmtHAbs(ch.soll):"",
      ch.overtime>0?fmtHAbs(ch.overtime):"",
      ch.paidExtra>0?fmtHAbs(ch.paidExtra):"",
      entry.note||""
    ]);
  });

  // Abbuchungen als separate Sheet
  const adjRows=[["Datum","Typ","Stunden","Notiz"]];
  adjustments.forEach(a=>{
    adjRows.push([
      new Date(a.date).toLocaleDateString("de-DE"),
      a.type==="abgefeiert"?"Abgefeiert":"Ausgezahlt",
      a.hours,a.note||""
    ]);
  });

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wsAdj=XLSX.utils.aoa_to_sheet(adjRows);
  // Spaltenbreiten
  ws["!cols"]=[{wch:12},{wch:12},{wch:18},{wch:7},{wch:7},{wch:8},{wch:8},{wch:8},{wch:8},{wch:10},{wch:12},{wch:24}];
  wsAdj["!cols"]=[{wch:12},{wch:12},{wch:10},{wch:24}];
  XLSX.utils.book_append_sheet(wb,ws,"Zeiterfassung");
  XLSX.utils.book_append_sheet(wb,wsAdj,"Abbuchungen");
  const fname=`Zeiterfassung_${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}.xlsx`;
  XLSX.writeFile(wb,fname);
}

// ── Main View ──────────────────────────────────────────────────────────────────
function MainView({session,entries,adjustments,settings,syncing,lastSync,onSaveEntry,onDeleteEntry,onSaveAdjustments,onSaveSettings,onLogout}){
  const today=new Date();
  const[view,setView]=useState("kalender");
  const[year,setYear]=useState(today.getFullYear());
  const[month,setMonth]=useState(today.getMonth());
  const[modalDay,setModalDay]=useState(null);
  const[adjModal,setAdjModal]=useState(false);
  const[adjForm,setAdjForm]=useState({date:"",hours:"",type:"abgefeiert",note:""});
  const[showUser,setShowUser]=useState(false);

  const shiftTimes=settings.shiftTimes||{};
  const SHIFTS=useMemo(()=>buildShifts(shiftTimes),[JSON.stringify(shiftTimes)]);
  const holidays=useMemo(()=>getBremenHolidays(year),[year]);

  const getEntry=(y,m,d)=>entries[dateKey(y,m,d)]||null;

  // ── Nur bis heute zählen für Überstunden ──────────────────────────────────
  const monthAgg=useCallback((y,m2,upToDay=null)=>{
    const hols=getBremenHolidays(y);
    const dim=new Date(y,m2+1,0).getDate();
    const todayY=today.getFullYear(),todayM=today.getMonth(),todayD=today.getDate();
    let overtime=0,worked=0,paidExtra=0;
    for(let d=1;d<=dim;d++){
      // Keine Überstunden in der Zukunft
      if(y>todayY)continue;
      if(y===todayY&&m2>todayM)continue;
      if(y===todayY&&m2===todayM&&d>todayD)continue;
      if(upToDay!==null&&d>upToDay)continue;
      const e=entries[dateKey(y,m2,d)];if(!e)continue;
      const c=computeHours(y,m2,d,e,hols,settings,shiftTimes);
      worked+=c.net+c.paidExtra;overtime+=c.overtime;paidExtra+=c.paidExtra;
      // Überstundenfrei: bucht Überstunden ab
      if(c.isUeberstundenfrei)overtime-=c.net;
    }
    return{worked,overtime,paidExtra};
  },[entries,JSON.stringify(settings),JSON.stringify(shiftTimes),today.toDateString()]);

  const monthlyData=useMemo(()=>MONTHS_SHORT.map((_,m2)=>monthAgg(year,m2)),[year,monthAgg]);

  const allYearsOvertime=useMemo(()=>{
    const years=[...new Set(Object.keys(entries).map(k=>Number(k.split("-")[0])))];
    let total=0;
    const todayY=today.getFullYear(),todayM=today.getMonth(),todayD=today.getDate();
    for(const y of years){
      const yh=getBremenHolidays(y);
      for(let m2=0;m2<12;m2++){
        if(y>todayY)continue;
        if(y===todayY&&m2>todayM)continue;
        const dim=new Date(y,m2+1,0).getDate();
        for(let d=1;d<=dim;d++){
          if(y===todayY&&m2===todayM&&d>todayD)continue;
          const e=entries[dateKey(y,m2,d)];if(!e)continue;
          const c=computeHours(y,m2,d,e,yh,settings,shiftTimes);
          total+=c.overtime;
          if(c.isUeberstundenfrei)total-=c.net;
        }
      }
    }
    return total-adjustments.reduce((s,a)=>s+a.hours,0)+(settings.overtimeCarryover||0);
  },[entries,adjustments,JSON.stringify(settings),JSON.stringify(shiftTimes),today.toDateString()]);

  const yearAdj=adjustments.filter(a=>new Date(a.date).getFullYear()===year);
  const yearAdjTotal=yearAdj.reduce((s,a)=>s+a.hours,0);
  const yearOvertime=monthlyData.reduce((s,m)=>s+m.overtime,0);
  const yearPaidExtra=monthlyData.reduce((s,m)=>s+m.paidExtra,0);
  const yearWorked=monthlyData.reduce((s,m)=>s+m.worked,0);
  const cur=monthlyData[month];
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDow=(new Date(year,month,1).getDay()+6)%7;

  return(
    <div style={{minHeight:"100vh",width:"100%",maxWidth:"100vw",overflowX:"hidden",background:C.bg,color:C.text,fontFamily:"'Nunito','Helvetica Neue',sans-serif"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        *{box-sizing:border-box;}
        html,body{overflow-x:hidden;max-width:100vw;}
        ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:${C.border};border-radius:2px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scaleIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
        .fu{animation:fadeUp .25s ease}.si{animation:scaleIn .2s ease}
        .dcell{transition:all .12s;cursor:pointer;}
        .dcell:active{transform:scale(0.96);}
        .dcell:hover{box-shadow:0 3px 12px #E8651A25!important;}
        input,select,button{font-family:inherit;outline:none;}
        button{cursor:pointer;}
      `}</style>

      {/* Top Bar */}
      <div style={{background:C.card,borderBottom:`2px solid ${C.border}`,position:"sticky",top:0,zIndex:100,
        paddingTop:"env(safe-area-inset-top)",boxShadow:"0 2px 12px #E8651A18",width:"100%"}}>
        <div style={{height:54,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 12px",gap:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,minWidth:0,flex:1}}>
            <div style={{width:32,height:32,borderRadius:9,background:`linear-gradient(135deg,${C.primary},#C04E0E)`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,boxShadow:`0 3px 8px ${C.primary}40`}}>⚕️</div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:11,fontWeight:800,color:C.text,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>Zeiterfassung Krankenhaus</div>
              <div style={{fontSize:9,color:syncing?C.primary:C.faint,fontWeight:600}}>
                {syncing?"↑ Sync…":lastSync?`✓ ${lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`:`${settings.contractPct||100}% Stelle · Bremen`}
              </div>
            </div>
          </div>
          <div style={{display:"flex",height:54,flexShrink:0}}>
            {[["kalender","📅 Kalender"],["jahres","📊 Jahr"],["einstellungen","⚙️"]].map(([v,l])=>(
              <button key={v} onClick={()=>setView(v)} style={{background:"none",border:"none",
                padding:"0 8px",height:54,fontSize:12,fontWeight:view===v?800:500,
                color:view===v?C.primaryText:C.muted,
                borderBottom:view===v?`3px solid ${C.primary}`:"3px solid transparent",transition:"all .15s"}}>
                {l}
              </button>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
            <button onClick={()=>setYear(y=>y-1)} style={{background:C.bg2,border:`1.5px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:14,fontWeight:700}}>‹</button>
            <span style={{fontSize:12,minWidth:36,textAlign:"center",color:C.text,fontWeight:800}}>{year}</span>
            <button onClick={()=>setYear(y=>y+1)} style={{background:C.bg2,border:`1.5px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:14,fontWeight:700}}>›</button>
            <button onClick={()=>exportToExcel(entries,adjustments,settings)}
              title="Als Excel exportieren"
              style={{background:"#D1FAE5",border:`1.5px solid #6EE7B7`,color:"#065F46",borderRadius:7,width:28,height:26,fontSize:12,marginLeft:2,fontWeight:700}}>📥</button>
            <button onClick={()=>setShowUser(s=>!s)} style={{background:C.bg2,border:`1.5px solid ${C.border}`,color:C.muted,borderRadius:7,width:26,height:26,fontSize:12,marginLeft:2}}>👤</button>
          </div>
        </div>
      </div>

      {showUser&&(<>
        <div style={{position:"fixed",top:`calc(54px + env(safe-area-inset-top))`,right:12,
          background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px 16px",
          zIndex:300,minWidth:210,boxShadow:"0 8px 28px #C04E0E25"}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:10,fontWeight:600}}>{session.user.email}</div>
          <button onClick={onLogout} style={{width:"100%",padding:"9px",background:C.redBg,
            border:`1.5px solid #FECACA`,borderRadius:9,color:C.red,fontSize:13,fontWeight:700}}>Abmelden</button>
        </div>
        <div style={{position:"fixed",inset:0,zIndex:299}} onClick={()=>setShowUser(false)}/>
      </>)}

      {/* ── KALENDER ── */}
      {view==="kalender"&&(
        <div className="fu" style={{width:"100%",maxWidth:860,margin:"0 auto",padding:"12px 10px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
          {/* Month strip */}
          <div style={{display:"flex",gap:4,marginBottom:10,overflowX:"auto",paddingBottom:4,WebkitOverflowScrolling:"touch"}}>
            {MONTHS_SHORT.map((ms,i)=>{
              const md=monthlyData[i],active=i===month;
              return(<button key={ms} onClick={()=>setMonth(i)} style={{flex:"0 0 auto",padding:"5px 10px",borderRadius:10,fontSize:11,
                background:active?C.primary:C.card,border:`2px solid ${active?C.primary:C.border}`,
                color:active?"#fff":C.muted,fontWeight:active?800:600,transition:"all .15s",boxShadow:active?`0 3px 10px ${C.primary}40`:"none"}}>
                <div>{ms}</div>
                {md.overtime>0&&<div style={{fontSize:9,marginTop:1,color:active?"#fff":C.green,fontWeight:700}}>+{fmtHAbs(md.overtime)}</div>}
              </button>);
            })}
          </div>

          {/* Month header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:6}}>
            <h2 style={{fontSize:18,fontWeight:800,color:C.text}}>{MONTHS_LONG[month]} <span style={{color:C.faint,fontWeight:400}}>{year}</span></h2>
            <div style={{display:"flex",gap:10}}>
              {[{l:"Gearbeitet",v:fmtHAbs(cur.worked),c:C.primaryText,bg:C.primaryLight},
                {l:"Überstunden",v:`+${fmtHAbs(cur.overtime)}`,c:C.green,bg:C.greenBg},
                ...(cur.paidExtra>0?[{l:"Ausgezahlt",v:fmtHAbs(cur.paidExtra),c:C.amber,bg:C.amberBg}]:[])
              ].map(s=>(
                <div key={s.l} style={{textAlign:"right",background:s.bg,borderRadius:9,padding:"4px 9px"}}>
                  <div style={{fontSize:9,color:C.faint,fontWeight:700,marginBottom:1}}>{s.l.toUpperCase()}</div>
                  <div style={{fontSize:13,fontWeight:800,color:s.c}}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Day headers */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:2}}>
            {["Mo","Di","Mi","Do","Fr","Sa","So"].map((d,i)=>(
              <div key={d} style={{textAlign:"center",fontSize:10,color:i>=5?C.red:C.faint,padding:"2px 0",fontWeight:700}}>{d}</div>
            ))}
          </div>

          {/* Calendar weeks */}
          {(()=>{
            const cells=[
              ...Array.from({length:firstDow},(_,i)=>({empty:true,key:`e${i}`})),
              ...Array.from({length:daysInMonth},(_,i)=>({day:i+1})),
            ];
            while(cells.length%7!==0)cells.push({empty:true,key:`t${cells.length}`});
            const weeks=[];
            for(let w=0;w<cells.length/7;w++)weeks.push(cells.slice(w*7,w*7+7));
            return weeks.map((week,wi)=>{
              let wWorked=0,wPaid=0;
              week.forEach(c=>{
                if(!c.day)return;
                const e=getEntry(year,month,c.day);if(!e)return;
                const ch=computeHours(year,month,c.day,e,holidays,settings,shiftTimes);
                wWorked+=ch.net+ch.paidExtra;wPaid+=ch.paidExtra;
              });
              return(
                <div key={wi}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:2}}>
                    {week.map((cell,ci)=>{
                      if(cell.empty)return<div key={cell.key||`ec${wi}${ci}`}/>;
                      const d=cell.day,dow=new Date(year,month,d).getDay();
                      const we=dow===0||dow===6,hol=isHoliday(year,month,d,holidays);
                      const holEve=!hol&&isHolidayEve(year,month,d,holidays)&&!we;
                      const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
                      const isFuture=(year>today.getFullYear())||(year===today.getFullYear()&&month>today.getMonth())||(year===today.getFullYear()&&month===today.getMonth()&&d>today.getDate());
                      const entry=getEntry(year,month,d);
                      const shift=entry?SHIFTS[entry.shiftType]:null;
                      const ch=entry?computeHours(year,month,d,entry,holidays,settings,shiftTimes):null;
                      const isDayOff=settings.partTimeMode==="fixedDay"&&settings.fixedDayOff&&
                        dow===Number(settings.fixedDayOff)&&getEffectivePct(year,month,d,settings)<100;
                      return(
                        <div key={d} className="dcell" onClick={()=>setModalDay({year,month,day:d})} style={{
                          minHeight:70,borderRadius:10,padding:"5px 4px",
                          background:shift?shift.bg:isDayOff?"#DCFCE7":we||hol?"#FDF0E8":C.card,
                          border:isToday?`2.5px solid ${C.primary}`:shift?`2px solid ${shift.color}80`:`1.5px solid ${C.border}`,
                          boxShadow:isToday?`0 0 0 3px ${C.primary}20`:"0 1px 4px #C04E0E08",
                          opacity:hol?0.65:isFuture?0.82:1,
                        }}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                            <span style={{fontSize:11,fontWeight:isToday?800:600,
                              color:isToday?C.primaryText:hol?C.purple:we?"#DC2626":C.muted}}>{d}</span>
                            {holEve&&<span style={{fontSize:7,color:C.purple,fontWeight:800}}>VFT</span>}
                            {hol&&<span style={{fontSize:7,color:C.purple,fontWeight:800}}>FT</span>}
                          </div>
                          {isDayOff&&!entry&&<div style={{fontSize:9,color:C.green,fontWeight:700}}>🌿 TZ-frei</div>}
                          {shift&&!shift.isOnCall&&!shift.noTimer&&(<>
                            <div style={{fontSize:10,color:C.text,fontWeight:700,marginBottom:1,lineHeight:1.2}}>{shift.icon} {shift.label}</div>
                            {entry.endTime&&<div style={{fontSize:9,color:C.muted,fontWeight:600}}>{fmtTime(SHIFTS[entry.shiftType].getStart?.(isFridayLike(year,month,d,holidays))||{h:0,m:0})}–{fmtTime(entry.endTime)}</div>}
                            {!isFuture&&ch?.overtime>0&&<div style={{fontSize:9,color:C.green,fontWeight:800}}>+{fmtHAbs(ch.overtime)}</div>}
                            {!isFuture&&ch?.paidExtra>0&&<div style={{fontSize:8,color:C.amber,fontWeight:700}}>💶 {fmtHAbs(ch.paidExtra)}</div>}
                          </>)}
                          {shift?.noTimer&&<div style={{fontSize:10,color:C.text,fontWeight:700}}>{shift.icon} {shift.label}</div>}
                          {shift?.isOnCall&&<div style={{fontSize:10,color:C.text,fontWeight:700}}>📞{entry.onCallActivationHours>0&&<span style={{color:C.amber}}> {entry.onCallActivationHours}h</span>}</div>}
                        </div>
                      );
                    })}
                  </div>
                  {wWorked>0&&(
                    <div style={{display:"flex",justifyContent:"flex-end",gap:10,padding:"2px 4px 7px",
                      borderBottom:`1.5px solid ${C.border}`,marginBottom:4,fontSize:10,color:C.muted}}>
                      <span style={{color:C.faint,fontWeight:600}}>KW {getISOWeek(new Date(year,month,week.find(c=>c.day)?.day))}</span>
                      <span>Gearbeitet: <strong style={{color:C.primaryText}}>{fmtHAbs(wWorked)}</strong></span>
                      {wPaid>0&&<span>Ausgezahlt: <strong style={{color:C.amber}}>{fmtHAbs(wPaid)}</strong></span>}
                    </div>
                  )}
                </div>
              );
            });
          })()}

          {/* Legend */}
          <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:6}}>
            {Object.entries(SHIFTS).map(([k,s])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:C.muted,background:C.card,borderRadius:6,padding:"2px 6px",border:`1px solid ${C.border}`}}>
                <div style={{width:7,height:7,borderRadius:2,background:s.color,flexShrink:0}}/>{s.icon} {s.label}
              </div>
            ))}
            <div style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:C.muted,background:C.card,borderRadius:6,padding:"2px 6px",border:`1px solid ${C.border}`}}>
              <span style={{color:C.purple,fontWeight:800,fontSize:9}}>FT</span> Feiertag (Bremen)
            </div>
          </div>
        </div>
      )}

      {/* ── JAHRESAUSWERTUNG ── */}
      {view==="jahres"&&(
        <div className="fu" style={{width:"100%",maxWidth:820,margin:"0 auto",padding:"12px 10px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
          {/* Excel export button prominent */}
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
            <button onClick={()=>exportToExcel(entries,adjustments,settings)}
              style={{background:`linear-gradient(135deg,#059669,#047857)`,border:"none",borderRadius:10,color:"#fff",
                padding:"9px 16px",fontSize:12,fontWeight:700,boxShadow:"0 3px 10px #05996930",display:"flex",alignItems:"center",gap:6}}>
              📥 Als Excel exportieren
            </button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {[
              {l:"Gesamtüberstunden (alle Jahre)",v:`+${fmtHAbs(allYearsOvertime)}`,c:C.green,bg:C.greenBg,big:true},
              {l:`Überstunden ${year} (bis heute)`,v:`+${fmtHAbs(yearOvertime)}`,c:C.primaryText,bg:C.primaryLight,big:true},
              {l:"Gesamtarbeitszeit",v:fmtHAbs(yearWorked),c:C.text,bg:C.card},
              {l:"Abgebaut / Ausgezahlt",v:fmtHAbs(yearAdjTotal),c:C.amber,bg:C.amberBg},
              {l:"Sofort ausgezahlt",v:fmtHAbs(yearPaidExtra),c:C.amber,bg:C.amberBg},
              ...(settings.overtimeCarryover?[{l:`Übertrag bis ${settings.overtimeCarryoverDate?new Date(settings.overtimeCarryoverDate).toLocaleDateString("de-DE"):"–"}`,v:`+${fmtHAbs(settings.overtimeCarryover||0)}`,c:C.purple,bg:"#EDE9FE"}]:[]),
              {l:"Eingetragene Dienste",v:Object.keys(entries).filter(k=>k.startsWith(String(year))).length+" Tage",c:C.muted,bg:C.card},
            ].map(card=>(
              <div key={card.l} style={{background:card.bg,borderRadius:13,padding:"12px 14px",border:`1.5px solid ${C.border}`,boxShadow:"0 2px 8px #C04E0E0A"}}>
                <div style={{fontSize:9,color:C.muted,fontWeight:700,marginBottom:5,letterSpacing:.5}}>{card.l.toUpperCase()}</div>
                <div style={{fontSize:card.big?22:15,fontWeight:800,color:card.c}}>{card.v}</div>
              </div>
            ))}
          </div>

          {/* Bar chart */}
          <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px #C04E0E0A"}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:.5,marginBottom:10}}>ÜBERSTUNDEN PRO MONAT {year} (NUR BIS HEUTE)</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:3,height:72}}>
              {monthlyData.map((md,i)=>{
                const mx=Math.max(...monthlyData.map(m=>m.overtime),1),p2=md.overtime/mx,has=md.overtime>0;
                return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  {has&&<div style={{fontSize:7,color:C.green,fontWeight:800}}>{fmtHAbs(md.overtime)}</div>}
                  <div style={{width:"100%",height:`${Math.max(p2*48,has?3:1)}px`,background:has?C.green:C.border,borderRadius:"3px 3px 0 0",transition:"height .4s"}}/>
                  <div style={{fontSize:9,color:i===month?C.primaryText:C.faint,fontWeight:i===month?800:600}}>{MONTHS_SHORT[i]}</div>
                </div>);
              })}
            </div>
          </div>

          {/* Monthly table */}
          <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px #C04E0E0A"}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:.5,marginBottom:8}}>MONATSÜBERSICHT {year}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr"}}>
              {["MONAT","GEARBEITET","ÜBERSTD.","AUSGEZ."].map(h=>(
                <div key={h} style={{fontSize:9,color:C.faint,fontWeight:700,padding:"3px 5px",borderBottom:`2px solid ${C.border}`}}>{h}</div>
              ))}
              {monthlyData.map((md,i)=>[
                <div key={`m${i}`} style={{fontSize:12,padding:"6px 5px",borderBottom:`1px solid ${C.bg}`,fontWeight:i===month?800:600,color:i===month?C.primaryText:C.text}}>{MONTHS_SHORT[i]}</div>,
                <div key={`w${i}`} style={{fontSize:12,padding:"6px 5px",borderBottom:`1px solid ${C.bg}`,color:C.muted,fontWeight:600}}>{md.worked>0?fmtHAbs(md.worked):"–"}</div>,
                <div key={`d${i}`} style={{fontSize:12,padding:"6px 5px",borderBottom:`1px solid ${C.bg}`,color:md.overtime>0?C.green:C.faint,fontWeight:md.overtime>0?800:600}}>{md.overtime>0?`+${fmtHAbs(md.overtime)}`:"–"}</div>,
                <div key={`p${i}`} style={{fontSize:12,padding:"6px 5px",borderBottom:`1px solid ${C.bg}`,color:md.paidExtra>0?C.amber:C.faint,fontWeight:md.paidExtra>0?700:400}}>{md.paidExtra>0?fmtHAbs(md.paidExtra):"–"}</div>,
              ])}
            </div>
          </div>

          {/* Carryover */}
          <CarryoverCard settings={settings} onSave={onSaveSettings}/>

          {/* Adjustments */}
          <div style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:14,padding:"14px",boxShadow:"0 2px 8px #C04E0E0A"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:.5}}>ABBUCHUNGEN {year}</div>
              <button onClick={()=>{setAdjForm({date:`${year}-01-01`,hours:"",type:"abgefeiert",note:""});setAdjModal(true);}}
                style={{background:C.primaryLight,border:`1.5px solid ${C.primary}`,color:C.primaryText,borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700}}>+ Eintrag</button>
            </div>
            {yearAdj.length===0&&<div style={{color:C.faint,fontSize:13,textAlign:"center",padding:"12px 0",fontWeight:600}}>Keine Abbuchungen für {year}</div>}
            {yearAdj.map((a,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"8px 1fr 1fr 1fr auto auto",alignItems:"center",gap:7,padding:"7px 3px",borderRadius:8}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:a.type==="abgefeiert"?C.green:C.amber}}/>
                <div style={{fontSize:11,color:C.muted,fontWeight:600}}>{new Date(a.date).toLocaleDateString("de-DE")}</div>
                <div style={{fontSize:12,fontWeight:600}}>{a.note||"–"}</div>
                <div style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:20,textAlign:"center",
                  color:a.type==="abgefeiert"?C.green:C.amber,background:a.type==="abgefeiert"?C.greenBg:C.amberBg}}>
                  {a.type==="abgefeiert"?"Abgefeiert":"Ausgezahlt"}
                </div>
                <div style={{fontSize:11,color:C.red,fontWeight:700}}>-{fmtHAbs(a.hours)}</div>
                <button onClick={()=>onSaveAdjustments(adjustments.filter((_,j)=>j!==adjustments.indexOf(a)))}
                  style={{background:"none",border:"none",color:C.faint,fontSize:18,lineHeight:1}}>×</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── EINSTELLUNGEN ── */}
      {view==="einstellungen"&&(
        <SettingsView settings={settings} onSave={onSaveSettings}/>
      )}

      {modalDay&&<DayModal day={modalDay} holidays={holidays}
        entry={getEntry(modalDay.year,modalDay.month,modalDay.day)}
        settings={settings} shiftTimes={shiftTimes} SHIFTS={SHIFTS}
        onSave={async data=>{
          // Überstundenfrei: automatisch Abbuchung eintragen
          const SHIFTS2=buildShifts(shiftTimes);
          const shift=SHIFTS2[data.shiftType];
          if(shift?.isUeberstundenfrei){
            const hols=getBremenHolidays(modalDay.year);
            const soll=getDailySoll(modalDay.year,modalDay.month,modalDay.day,hols,settings);
            if(soll>0){
              const key=dateKey(modalDay.year,modalDay.month,modalDay.day);
              const dateStr=key;
              const existingAdj=adjustments.filter(a=>a.date!==dateStr||a._autoUeberst!==true);
              const newAdj=[...existingAdj,{date:dateStr,hours:soll,type:"abgefeiert",note:"Überstundenfrei",_autoUeberst:true}];
              await onSaveAdjustments(newAdj);
            }
          } else {
            // Wenn ein früherer Überstundenfrei-Eintrag existiert, entfernen
            const key=dateKey(modalDay.year,modalDay.month,modalDay.day);
            const cleaned=adjustments.filter(a=>!(a.date===key&&a._autoUeberst===true));
            if(cleaned.length!==adjustments.length)await onSaveAdjustments(cleaned);
          }
          onSaveEntry(dateKey(modalDay.year,modalDay.month,modalDay.day),data);setModalDay(null);
        }}
        onDelete={async()=>{
          const key=dateKey(modalDay.year,modalDay.month,modalDay.day);
          const cleaned=adjustments.filter(a=>!(a.date===key&&a._autoUeberst===true));
          if(cleaned.length!==adjustments.length)await onSaveAdjustments(cleaned);
          onDeleteEntry(key);setModalDay(null);
        }}
        onClose={()=>setModalDay(null)}/>}

      {adjModal&&<AdjModal form={adjForm} onChange={setAdjForm}
        onSave={()=>{if(!adjForm.hours||isNaN(+adjForm.hours))return;
          onSaveAdjustments([...adjustments,{...adjForm,hours:+adjForm.hours}]);setAdjModal(false);}}
        onClose={()=>setAdjModal(false)}/>}
    </div>
  );
}

// ── Settings View ──────────────────────────────────────────────────────────────
function SettingsView({settings,onSave}){
  const[pct,setPct]=useState(settings.contractPct||100);
  const[partTimeMode,setPartTimeMode]=useState(settings.partTimeMode||"none");
  const[fixedDayOff,setFixedDayOff]=useState(settings.fixedDayOff||1);
  const[partTimeStart,setPartTimeStart]=useState(settings.partTimeStart||"");
  const[times,setTimes]=useState(settings.shiftTimes||{});
  const[saved,setSaved]=useState(false);
  const[openShift,setOpenShift]=useState(null);

  const save=async()=>{
    await onSave({
      contractPct:Number(pct),
      partTimeMode,
      fixedDayOff:Number(fixedDayOff),
      partTimeStart:partTimeStart||null,
      shiftTimes:times,
      overtimeCarryover:settings.overtimeCarryover,
      overtimeCarryoverDate:settings.overtimeCarryoverDate,

  };

  const updateTime=(key,field,val)=>{
    setTimes(p=>{const def=DEFAULT_SHIFT_TIMES[key]||{};return{...p,[key]:{...def,...(p[key]||{}),[field]:Number(val)}};});
  };

  const editableKeys=["TAGDIENST","LANGER_DIENST","LANGER_DIENST_WE","VISITENDIENST","SPAETDIENST"];

      {/* Hinweis: Änderungen wirken auf alle Einträge */}

        ℹ️ Änderungen an Dienstzeiten werden auf <strong>alle</strong> eingetragenen Dienste angewendet – auch bereits erfasste.
      </div>

      {/* Contract % */}
      <div style={card}>
        <div style={sectionLabel}>STELLENUMFANG</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:10}}>
          {[100,90,80,75,60,50].map(p=>(
            <button key={p} onClick={()=>setPct(p)} style={{padding:"7px 13px",borderRadius:9,fontSize:13,fontWeight:700,
              background:pct===p?C.primary:C.bg,border:`1.5px solid ${pct===p?C.primary:C.border}`,
              color:pct===p?"#fff":C.muted,transition:"all .15s"}}>{p}%</button>
          ))}
          <input type="number" min={10} max={100} value={pct} onChange={e=>setPct(e.target.value)}
            style={{width:64,padding:"7px",borderRadius:9,border:`1.5px solid ${C.border}`,background:C.bg,fontSize:13,color:C.text,textAlign:"center",fontFamily:"inherit"}}/>
        </div>
        <div style={{background:C.primaryLight,borderRadius:9,padding:"9px 12px",fontSize:12,color:C.primaryText,lineHeight:1.7,fontWeight:600}}>
          <strong>Bei {pct}% Stelle:</strong><br/>
          Tagessoll Mo–Do: <strong>{fmtHAbs(8.0*pct/100)}</strong> &nbsp;·&nbsp; Fr/VFT: <strong>{fmtHAbs(7.5*pct/100)}</strong>
        </div>
      </div>

      {/* Part-time mode */}
      <div style={card}>
        <div style={sectionLabel}>TEILZEITMODELL</div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
          {[
            ["none","Kein festes Modell (flexibel)"],
            ["fixedDay","Fester freier Tag pro Woche"],

              background:partTimeMode===v?C.primary:C.bg,
              border:`1.5px solid ${partTimeMode===v?C.primary:C.border}`,
              color:partTimeMode===v?"#fff":C.muted}}>{l}</button>

        </div>
        {partTimeMode==="fixedDay"&&(

            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[[1,"Mo"],[2,"Di"],[3,"Mi"],[4,"Do"],[5,"Fr"]].map(([v,l])=>(

          Vor dem {new Date(partTimeStart).toLocaleDateString("de-DE")}: 100% · Ab dann: {pct}%
        </div>}
      </div>

      {/* Shift times */}
      <div style={card}>
        <div style={sectionLabel}>DIENSTZEITEN ANPASSEN</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:10,fontWeight:600}}>Tippe auf einen Dienst um die Zeiten zu ändern. Änderungen gelten sofort für alle Einträge.</div>
        {editableKeys.map(k=>{
          const s=SHIFTS[k];
          const def=DEFAULT_SHIFT_TIMES[k]||{};

              <span style={{fontSize:11,color:C.muted,fontWeight:700}}>{isOpen?"▲":"▼"}</span>
            </button>
            {isOpen&&(
              <div style={{padding:"11px 13px",background:s.bg,borderTop:`1px solid ${s.color}30`}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,fontSize:12}}>

                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>START</div>

                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>ENDE Mo–Do</div>
                      <TI h={cur.endH} m={cur.endM} onH={v=>updateTime(k,"endH",v)} onM={v=>updateTime(k,"endM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>ENDE Fr / VFT (Soll: 8h netto)</div>
                      <TI h={cur.endFriH} m={cur.endFriM} onH={v=>updateTime(k,"endFriH",v)} onM={v=>updateTime(k,"endFriM",v)}/></div>
                  </>)}
                  {k==="LANGER_DIENST"&&(<>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>START Mo–Do</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>ENDE Mo–Do</div>
                      <TI h={cur.endH} m={cur.endM} onH={v=>updateTime(k,"endH",v)} onM={v=>updateTime(k,"endM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>START Fr / VFT</div>

                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>ENDE Fr / VFT</div>
                      <TI h={cur.endFriH} m={cur.endFriM} onH={v=>updateTime(k,"endFriH",v)} onM={v=>updateTime(k,"endFriM",v)}/></div>
                  </>)}
                  {k==="LANGER_DIENST_WE"&&(<>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>START (Sa+So)</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>ENDE (12h + 45min Pause)</div>

                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>START</div>
                      <TI h={cur.startH} m={cur.startM} onH={v=>updateTime(k,"startH",v)} onM={v=>updateTime(k,"startM",v)}/></div>
                    <div><div style={{color:C.muted,fontWeight:700,marginBottom:4}}>PFLICHTENDE</div>
                      <TI h={cur.fixedEndH} m={cur.fixedEndM} onH={v=>updateTime(k,"fixedEndH",v)} onM={v=>updateTime(k,"fixedEndM",v)}/></div>
                  </>)}
                </div>
                <button onClick={()=>setTimes(p=>{const n={...p};delete n[k];return n;})}
                  style={{marginTop:9,fontSize:11,color:C.muted,background:"none",border:`1.5px solid ${C.border}`,borderRadius:7,padding:"4px 10px",fontWeight:600}}>
                  Zurücksetzen
                </button>
              </div>
            )}
          </div>);
        })}
      </div>

      <button onClick={save} style={{width:"100%",padding:"13px",
        background:saved?C.green:`linear-gradient(135deg,${C.primary},#C04E0E)`,border:"none",
        borderRadius:13,color:"#fff",fontSize:15,fontWeight:800,boxShadow:`0 4px 16px ${C.primary}40`,transition:"background .3s"}}>
        {saved?"✓ Gespeichert!":"Einstellungen speichern"}
      </button>
    </div>
  );
}

function TI({h,m,onH,onM}){
  const s={width:52,padding:"7px 4px",borderRadius:9,border:`1.5px solid ${C.border}`,background:C.card,fontSize:15,fontWeight:800,textAlign:"center",color:C.text,fontFamily:"inherit"};
  return(<div style={{display:"flex",alignItems:"center",gap:4}}>
    <input type="number" min={0} max={23} value={pad(h||0)} onChange={e=>onH(e.target.value)} style={s}/>
    <span style={{color:C.muted,fontWeight:800}}>:</span>
    <input type="number" min={0} max={59} value={pad(m||0)} onChange={e=>onM(e.target.value)} style={s}/>
  </div>);
}

// ── Day Modal ──────────────────────────────────────────────────────────────────
function DayModal({day,entry,holidays,settings,shiftTimes,SHIFTS,onSave,onDelete,onClose}){
  const{year,month,day:d}=day;
  const dow=new Date(year,month,d).getDay();
  const we=dow===0||dow===6,hol=isHoliday(year,month,d,holidays),fri=isFridayLike(year,month,d,holidays);
  const[shiftType,setShiftType]=useState(entry?.shiftType||(we?"LANGER_DIENST_WE":"TAGDIENST"));
  const[endH,setEndH]=useState(entry?.endTime?.h??"");
  const[endM,setEndM]=useState(entry?.endTime?.m??"");
  const[onCallH,setOnCallH]=useState(entry?.onCallActivationHours??"");
  const[note,setNote]=useState(entry?.note||"");

  const shift=SHIFTS[shiftType];
  const startT=shift?.getStart?.(fri);
  const fixedEnd=shift?.fixedEnd?.();
  const defaultEnd=fixedEnd||shift?.getEnd?.(fri);
  const endTime=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;

  let preview=null;
  if(startT&&endTime&&!shift?.noTimer&&!shift?.isOnCall&&!shift?.isUeberstundenfrei){
    let gm=toMin(endTime)-toMin(startT);if(gm<0)gm+=24*60;
    const bm=calcBreak(gm),nh=(gm-bm)/60;
    const soll=getDailySoll(year,month,d,holidays,settings);
    let pe=0,ot=0;
    if(shift.allPaid){
      pe=nh;ot=0;
    } else if(shift.hasPaidExtra&&fixedEnd){
      const et=toMin(endTime),ft=toMin(fixedEnd);if(et>ft)pe=(et-ft)/60;
      ot=Math.max(0,nh-pe-soll);
    } else if(shift.paidExtraAfterSoll){
      const ov=nh-soll;if(ov>0)pe=ov;
      ot=0;
    } else {
      ot=Math.max(0,nh-soll);
    }
    preview={net:shift.allPaid?0:nh-pe,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
  }

  // Überstundenfrei preview
  let uebPreview=null;
  if(shift?.isUeberstundenfrei){
    const soll=getDailySoll(year,month,d,holidays,settings);
    uebPreview=soll;
  }

  // Filter available shifts: on weekend show LANGER_DIENST_WE, not LANGER_DIENST
  // On weekdays show LANGER_DIENST, not LANGER_DIENST_WE
  const available=Object.entries(SHIFTS).filter(([k,s])=>{
    if(k==="LANGER_DIENST_WE"&&!we)return false;
    if(k==="LANGER_DIENST"&&we)return false;
    return true;
  });

  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 13px",fontSize:13,color:C.text,fontFamily:"inherit"};

  return(
    <div style={{position:"fixed",inset:0,background:"#3D1A0050",display:"flex",alignItems:"flex-end",
      justifyContent:"center",zIndex:200,backdropFilter:"blur(4px)"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:C.card,borderRadius:"24px 24px 0 0",padding:"18px 16px",
        width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",
        paddingBottom:"max(20px,env(safe-area-inset-bottom))"}}>
        <div style={{width:44,height:5,background:C.border,borderRadius:3,margin:"0 auto 14px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:2}}>{DOW_LONG[dow].toUpperCase()}, {d}. {MONTHS_LONG[month]} {year}</div>
            {hol&&<div style={{fontSize:11,color:C.purple,fontWeight:700}}>🎌 Feiertag (Bremen)</div>}
            {!hol&&fri&&dow!==5&&<div style={{fontSize:11,color:C.purple,fontWeight:700}}>⚡ Vortag Feiertag – wie Freitag</div>}
          </div>
          <button onClick={onClose} style={{background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,width:32,height:32,fontSize:18,color:C.muted,fontWeight:700}}>×</button>
        </div>

        {/* Shift selector – equal width grid */}
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:7}}>DIENSTFORM</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
            {available.map(([k,s])=>(
              <button key={k} onClick={()=>setShiftType(k)} style={{padding:"9px 10px",borderRadius:11,textAlign:"left",
                fontSize:12,fontWeight:700,transition:"all .15s",
                background:shiftType===k?s.bg:C.bg,
                border:`2px solid ${shiftType===k?s.color:C.border}`,
                color:shiftType===k?C.text:C.muted}}>
                {s.icon} {s.label}
              </button>
            ))}
          </div>
        </div>

        {/* Überstundenfrei info */}
        {shift?.isUeberstundenfrei&&uebPreview!==null&&(
          <div style={{background:"#CFFAFE",borderRadius:11,padding:"10px 13px",marginBottom:12,border:"1.5px solid #0891B2"}}>
            <div style={{fontSize:12,color:C.teal,fontWeight:800}}>🎯 Überstundenfrei</div>
            <div style={{fontSize:12,color:C.teal,marginTop:4,fontWeight:600}}>
              Es werden automatisch <strong>{fmtHAbs(uebPreview)}</strong> Netto-Sollstunden als „Abgefeiert" in die Abbuchungen eingetragen.
            </div>
          </div>
        )}

        {/* Shift info */}
        {startT&&(
          <div style={{background:C.bg,borderRadius:10,padding:"9px 12px",marginBottom:11,fontSize:12,border:`1px solid ${C.border}`}}>
            <div style={{color:C.muted,fontWeight:600}}>
              Start: <strong style={{color:C.text}}>{fmtTime(startT)}</strong>
              {fixedEnd&&<> · Pflichtende: <strong style={{color:C.text}}>{fmtTime(fixedEnd)}</strong></>}
              {!fixedEnd&&defaultEnd&&<> · Planende: <strong style={{color:C.muted}}>{fmtTime(defaultEnd)}</strong></>}
            </div>
            {shift?.allPaid&&<div style={{color:C.amber,marginTop:3,fontWeight:700}}>💶 Alle Stunden werden sofort ausgezahlt</div>}
            {shift?.hasOnCall&&<div style={{color:C.purple,marginTop:3,fontWeight:700}}>📞 Rufbereitschaft nach Dienstende</div>}
            {shift?.hasPaidExtra&&!shift?.allPaid&&<div style={{color:C.amber,marginTop:3,fontWeight:600}}>💶 Überstunden über Pflichtende werden sofort ausgezahlt</div>}
          </div>
        )}

        {/* End time */}
        {!shift?.noTimer&&!shift?.isOnCall&&!shift?.isUeberstundenfrei&&(
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:7}}>
              {shift?.allPaid?"ENDZEIT (alle Stunden werden ausgezahlt)":shift?.hasPaidExtra?"TATSÄCHLICHE ENDZEIT":"ENDZEIT (leer = Planende)"}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="number" min={0} max={23} value={endH} onChange={e=>setEndH(e.target.value)}
                placeholder={defaultEnd?pad(defaultEnd.h):"hh"}
                style={{width:68,background:C.bg,border:`2px solid ${C.border}`,borderRadius:10,
                  padding:"10px 8px",fontSize:22,fontWeight:800,color:C.text,textAlign:"center",fontFamily:"inherit"}}/>
              <span style={{fontSize:24,color:C.muted,fontWeight:800}}>:</span>
              <input type="number" min={0} max={59} value={endM} onChange={e=>setEndM(e.target.value)}
                placeholder={defaultEnd?pad(defaultEnd.m):"mm"}
                style={{width:68,background:C.bg,border:`2px solid ${C.border}`,borderRadius:10,
                  padding:"10px 8px",fontSize:22,fontWeight:800,color:C.text,textAlign:"center",fontFamily:"inherit"}}/>
              <span style={{fontSize:13,color:C.muted,fontWeight:600}}>Uhr</span>
              {(endH!==""||endM!=="")&&<button onClick={()=>{setEndH("");setEndM("");}}
                style={{background:"none",border:"none",color:C.faint,fontSize:22}}>↺</button>}
            </div>
          </div>
        )}

        {shift?.isOnCall&&(
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:7}}>AKTIVIERUNGSSTUNDEN (ausgezahlt, kein Saldo)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="z.B. 1.5" style={inp}/>
          </div>
        )}

        {shift?.hasOnCall&&!shift?.isOnCall&&(
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.purple,fontWeight:700,marginBottom:7}}>📞 RUFBEREITSCHAFT – AKTIVIERUNGSSTUNDEN (ausgezahlt)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="Einsatzstunden (optional)" style={inp}/>
          </div>
        )}

        {/* Preview */}
        {preview&&(
          <div style={{background:C.bg,borderRadius:11,padding:"11px 12px",marginBottom:12,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:7}}>VORSCHAU</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:7}}>
              {[["BRUTTO",fmtHAbs(preview.gross)],["PAUSE",`${preview.breakMin}min`],["NETTO",fmtHAbs(preview.net)]].map(([l,v])=>(
                <div key={l}><div style={{fontSize:9,color:C.faint,fontWeight:700}}>{l}</div>
                  <div style={{fontSize:14,fontWeight:800,color:C.text}}>{v}</div></div>
              ))}
            </div>
            {preview.paidExtra>0&&<div style={{fontSize:12,color:C.amber,fontWeight:800,marginBottom:4}}>💶 Sofort ausgezahlt: {fmtHAbs(preview.paidExtra)}</div>}
            <div style={{fontSize:13,fontWeight:800}}>
              {preview.overtime>0?<span style={{color:C.green}}>+{fmtHAbs(preview.overtime)} Überstunden</span>
                :preview.paidExtra>0?<span style={{color:C.amber}}>Alle Stunden sofort ausgezahlt</span>
                :<span style={{color:C.muted}}>Keine Überstunden</span>}
              <span style={{color:C.faint,marginLeft:8,fontWeight:600,fontSize:11}}>Soll: {fmtHAbs(preview.soll)}</span>
            </div>
          </div>
        )}

        {/* Note */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:7}}>NOTIZ (optional)</div>
          <input type="text" value={note} onChange={e=>setNote(e.target.value)}
            placeholder="Station, Einsatz, Bemerkung..." style={inp}/>
        </div>

        <div style={{display:"flex",gap:8}}>
          {entry&&<button onClick={onDelete}
            style={{padding:"12px 15px",background:C.redBg,border:`1.5px solid #FECACA`,borderRadius:12,color:C.red,fontSize:13,fontWeight:800}}>
            Löschen
          </button>}
          <button onClick={()=>{
            const et=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;
            onSave({shiftType,endTime:et,onCallActivationHours:onCallH!==""?+onCallH:0,note});
          }} style={{flex:1,padding:"13px",background:`linear-gradient(135deg,${C.primary},#C04E0E)`,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:800,boxShadow:`0 4px 16px ${C.primary}40`}}>
            Speichern
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Carryover Card ─────────────────────────────────────────────────────────────
function CarryoverCard({settings,onSave}){
  const[hours,setHours]=useState(settings.overtimeCarryover||"");
  const[date,setDate]=useState(settings.overtimeCarryoverDate||"");
  const[saved,setSaved]=useState(false);
  const[open,setOpen]=useState(false);
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 12px",fontSize:14,fontWeight:700,color:C.text,fontFamily:"inherit"};

  const save=async()=>{
    await onSave({...settings,overtimeCarryover:hours!==""?Number(hours):0,overtimeCarryoverDate:date||null});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  const clear=async()=>{
    setHours("");setDate("");
    await onSave({...settings,overtimeCarryover:0,overtimeCarryoverDate:null});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };

  const hasValue=settings.overtimeCarryover>0;
  return(
    <div style={{background:C.card,border:`1.5px solid ${hasValue?"#A78BFA":C.border}`,borderRadius:13,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px #C04E0E0A"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"none",border:"none",padding:0,textAlign:"left"}}>
        <div>
          <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:.4,marginBottom:3}}>ÜBERSTUNDEN-ÜBERTRAG</div>
          {hasValue
            ?<div style={{fontSize:13,fontWeight:800,color:C.purple}}>+{fmtHAbs(settings.overtimeCarryover)} bis {settings.overtimeCarryoverDate?new Date(settings.overtimeCarryoverDate).toLocaleDateString("de-DE"):"–"}</div>
            :<div style={{fontSize:12,color:C.faint,fontWeight:600}}>Bereits geleistete Überstunden vor App-Nutzung eintragen</div>
          }
        </div>
        <span style={{fontSize:13,color:C.muted,marginLeft:8,fontWeight:700}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{marginTop:12,paddingTop:12,borderTop:`1.5px solid ${C.border}`}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6,fontWeight:600}}>
            Trage hier Überstunden ein, die du <strong>vor Beginn der App-Nutzung</strong> bereits angesammelt hast.
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:5}}>STUNDEN</div>
              <input type="number" min={0} step={0.5} value={hours} onChange={e=>setHours(e.target.value)} placeholder="z.B. 24.5" style={inp}/>
            </div>
            <div>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:5}}>ÜBERSTUNDEN BIS ZUM</div>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inp,fontSize:13}}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {hasValue&&<button onClick={clear} style={{padding:"9px 14px",background:C.redBg,border:`1.5px solid #FECACA`,borderRadius:10,color:C.red,fontSize:13,fontWeight:700}}>Löschen</button>}
            <button onClick={save} style={{flex:1,padding:"10px",background:saved?"#6D28D9":C.primary,border:"none",borderRadius:10,color:"#fff",fontSize:13,fontWeight:800,transition:"background .3s"}}>
              {saved?"✓ Gespeichert!":"Speichern"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Adj Modal ──────────────────────────────────────────────────────────────────
function AdjModal({form,onChange,onSave,onClose}){
  const inp={width:"100%",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 13px",color:C.text,fontSize:13,fontFamily:"inherit"};
  return(
    <div style={{position:"fixed",inset:0,background:"#3D1A0050",display:"flex",alignItems:"flex-end",
      justifyContent:"center",zIndex:200,backdropFilter:"blur(4px)"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:C.card,borderRadius:"24px 24px 0 0",padding:"18px 16px",
        width:"100%",maxWidth:520,paddingBottom:"max(20px,env(safe-area-inset-bottom))"}}>
        <div style={{width:44,height:5,background:C.border,borderRadius:3,margin:"0 auto 14px"}}/>
        <div style={{fontSize:16,fontWeight:800,color:C.text,marginBottom:14}}>Überstunden abbuchen</div>
        {[{l:"DATUM",f:"date",t:"date"},{l:"STUNDEN",f:"hours",t:"number",pl:"z.B. 8"},{l:"NOTIZ",f:"note",t:"text",pl:"z.B. Freizeitausgleich KW 12"}].map(field=>(
          <div key={field.f} style={{marginBottom:11}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:5}}>{field.l}</div>
            <input type={field.t} value={form[field.f]} placeholder={field.pl} step={field.t==="number"?"0.5":undefined}
              onChange={e=>onChange(p=>({...p,[field.f]:e.target.value}))} style={inp}/>
          </div>
        ))}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:7}}>TYP</div>
          <div style={{display:"flex",gap:8}}>
            {[["abgefeiert","Abgefeiert 🟢",C.green,C.greenBg],["ausgezahlt","Ausgezahlt 🟡",C.amber,C.amberBg]].map(([v,l,col,bg])=>(
              <button key={v} onClick={()=>onChange(p=>({...p,type:v}))} style={{flex:1,padding:"10px",borderRadius:10,fontSize:13,fontWeight:700,
                background:form.type===v?bg:C.bg,border:`1.5px solid ${form.type===v?col:C.border}`,color:form.type===v?col:C.muted}}>{l}</button>
            ))}
          </div>
        </div>
        <button onClick={onSave} style={{width:"100%",padding:"13px",background:`linear-gradient(135deg,${C.primary},#C04E0E)`,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:800}}>Speichern</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
