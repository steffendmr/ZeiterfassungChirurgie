// ─── Bremen Holidays ─────────────────────────────────────────────────────────
function getBremenHolidays(year) {
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31)-1;
  const dy=((h+l-7*m+114)%31)+1;
  const easter=new Date(year,mo,dy);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([
    `${year}-01-01`,fmt(add(easter,-2)),fmt(easter),fmt(add(easter,1)),
    `${year}-05-01`,fmt(add(easter,39)),fmt(add(easter,49)),fmt(add(easter,50)),
    `${year}-10-03`,`${year}-10-31`,`${year}-12-25`,`${year}-12-26`,
  ]);
}

function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isHolidayEve(y,m,d,hols){const nx=new Date(y,m,d+1);return hols.has(dateKey(nx.getFullYear(),nx.getMonth(),nx.getDate()));}
function isFridayLike(y,m,d,hols){const dow=new Date(y,m,d).getDay();return dow===5||isHolidayEve(y,m,d,hols);}
function isWeekend(y,m,d){const dow=new Date(y,m,d).getDay();return dow===0||dow===6;}
function isHoliday(y,m,d,hols){return hols.has(dateKey(y,m,d));}
function getISOWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);}

const SHIFTS = {
  TAGDIENST:{label:"Tagdienst",icon:"☀️",color:"#60A5FA",getStart:()=>({h:7,m:0}),getEnd:fri=>fri?{h:15,m:30}:{h:16,m:0},hasPaidExtra:false,isOnCall:false},

  LANGER_DIENST_WE:{label:"Langer Dienst WE",icon:"🌅",color:"#F97316",getStart:()=>({h:8,m:30}),getEnd:()=>({h:20,m:30}),hasPaidExtra:true,paidExtraAfterSoll:true,isOnCall:false,weekendOnly:true},
  VISITENDIENST:{label:"Visitendienst",icon:"🩺",color:"#34D399",getStart:()=>({h:8,m:30}),fixedEnd:{h:11,m:30},hasOnCall:true,hasPaidExtra:true,isOnCall:false},
  SPAETDIENST:{label:"Spätdienst",icon:"🌆",color:"#A78BFA",getStart:()=>({h:10,m:30}),fixedEnd:{h:22,m:30},hasOnCall:true,hasPaidExtra:true,isOnCall:false},
  RUFBEREITSCHAFT:{label:"Rufbereitschaft",icon:"📞",color:"#94A3B8",getStart:()=>null,getEnd:()=>null,hasPaidExtra:false,isOnCall:true},
  URLAUB:{label:"Urlaub",icon:"🏖",color:"#6EE7B7",getStart:()=>null,getEnd:()=>null,hasPaidExtra:false,isOnCall:false,noTimer:true},
  KRANK:{label:"Krank",icon:"🤒",color:"#FCA5A5",getStart:()=>null,getEnd:()=>null,hasPaidExtra:false,isOnCall:false,noTimer:true},
  FORTBILDUNG:{label:"Fortbildung",icon:"📚",color:"#7DD3FC",getStart:()=>null,getEnd:()=>null,hasPaidExtra:false,isOnCall:false,noTimer:true},
};

const SOLL_MON_THU=8.5, SOLL_FRI=8.0;
function getDailySoll(y,m,d,hols){if(isWeekend(y,m,d)||isHoliday(y,m,d,hols))return 0;return isFridayLike(y,m,d,hols)?SOLL_FRI:SOLL_MON_THU;}
function calcBreak(min){return min>=9*60?45:30;}

const pad=n=>String(n).padStart(2,"0");
const toMin=({h,m})=>h*60+m;
const fmtTime=({h,m})=>`${pad(h)}:${pad(m)}`;
const fmtHAbs=h=>{const a=Math.abs(h),hh=Math.floor(a),mm=Math.round((a-hh)*60);return `${hh}h${mm>0?" "+mm+"m":""}`;};
const fmtH=h=>{const s=h<0?"-":"+";const a=Math.abs(h);const hh=Math.floor(a),mm=Math.round((a-hh)*60);return `${s}${hh}:${pad(mm)}`;};

const MONTHS_LONG=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_SHORT=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

function computeHours(y,m,d,entry,hols){
  const soll=getDailySoll(y,m,d,hols);
  if(!entry)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  const shift=SHIFTS[entry.shiftType];
  if(!shift)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  if(shift.isOnCall)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0,onCallHours:entry.onCallActivationHours||0};
  if(shift.noTimer)return{net:soll,soll,gross:soll,breakMin:0,paidExtra:0,overtime:0};
  const fri=isFridayLike(y,m,d,hols);
  const startT=shift.getStart(fri);
  const endT=entry.endTime||shift.getEnd?.(fri)||shift.fixedEnd;
  if(!startT||!endT)return{net:0,soll,gross:0,breakMin:0,paidExtra:0,overtime:0};
  let grossMin=toMin(endT)-toMin(startT);
  if(grossMin<0)grossMin+=24*60;
  const breakMin=calcBreak(grossMin-30);
  const netH=(grossMin-breakMin)/60;
  let paidExtra=0;
  if(shift.hasPaidExtra&&shift.fixedEnd){const fe=toMin(shift.fixedEnd),ee=toMin(endT);if(ee>fe)paidExtra=(ee-fe)/60;}
  else if(shift.paidExtraAfterSoll){const ov=netH-soll;if(ov>0)paidExtra=ov;}
  const netForSaldo=netH-paidExtra;
  const overtime=shift.paidExtraAfterSoll?0:Math.max(0,netForSaldo-soll);
  return{net:netForSaldo,soll,gross:grossMin/60,breakMin,paidExtra,overtime,onCallHours:entry.onCallActivationHours||0};
}

            {loading?"…":mode==="login"?"Anmelden":"Konto erstellen"}
          </button>
          <div style={{textAlign:"center",marginTop:16,fontSize:12,color:"#334155"}}>

// ─── Main App ─────────────────────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [entries,setEntries]=useState({});
  const [adjustments,setAdjustments]=useState([]);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);

  // Auth
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthLoading(false);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setSession(session));
    return()=>subscription.unsubscribe();
  },[]);

  // Load data from Supabase when logged in
  useEffect(()=>{
    if(!session)return;
    loadData();
  },[session]);

  const loadData=async()=>{
    setSyncing(true);
    try{
      const uid=session.user.id;
      const [eRes,aRes]=await Promise.all([
        sb.from("entries").select("*").eq("user_id",uid),
        sb.from("adjustments").select("*").eq("user_id",uid),
      ]);
      if(eRes.data){
        const map={};
        eRes.data.forEach(r=>{map[r.date_key]=JSON.parse(r.data);});
        setEntries(map);
      }
      if(aRes.data){
        setAdjustments(aRes.data.map(r=>JSON.parse(r.data)));
      }
      setLastSync(new Date());
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  const saveEntryRemote=async(key,data)=>{
    const uid=session.user.id;
    await sb.from("entries").upsert({user_id:uid,date_key:key,data:JSON.stringify(data)},{onConflict:"user_id,date_key"});
    setLastSync(new Date());
  };
  const deleteEntryRemote=async(key)=>{
    const uid=session.user.id;
    await sb.from("entries").delete().eq("user_id",uid).eq("date_key",key);
    setLastSync(new Date());
  };
  const saveAdjustmentsRemote=async(adjs)=>{
    const uid=session.user.id;
    await sb.from("adjustments").delete().eq("user_id",uid);
    if(adjs.length>0){
      await sb.from("adjustments").insert(adjs.map((a,i)=>({user_id:uid,idx:i,data:JSON.stringify(a)})));
    }
    setLastSync(new Date());
  };

  const logout=()=>sb.auth.signOut();

  if(authLoading)return(
    <div style={{minHeight:"100vh",background:"#06090F",display:"flex",alignItems:"center",justifyContent:"center",color:"#334155",fontSize:14}}>Laden…</div>
  );
  if(!session)return <LoginScreen onLogin={s=>setSession(s)} />;

  return(
    <MainView
      session={session}
      entries={entries} setEntries={setEntries}
      adjustments={adjustments} setAdjustments={setAdjustments}
      syncing={syncing} lastSync={lastSync}
      onSaveEntry={async(key,data)=>{setEntries(p=>({...p,[key]:data}));await saveEntryRemote(key,data);}}
      onDeleteEntry={async(key)=>{setEntries(p=>{const n={...p};delete n[key];return n;});await deleteEntryRemote(key);}}
      onSaveAdjustments={async(adjs)=>{setAdjustments(adjs);await saveAdjustmentsRemote(adjs);}}
      onLogout={logout}
    />
  );
}

  const [adjModal,setAdjModal]=useState(false);
  const [adjForm,setAdjForm]=useState({date:"",hours:"",type:"abgefeiert",note:""});
  const [showUser,setShowUser]=useState(false);

  const holidays=useMemo(()=>getBremenHolidays(year),[year]);

  const getEntry=(y,m,d)=>entries[dateKey(y,m,d)]||null;

  function monthAggregate(y,m){
    const dim=new Date(y,m+1,0).getDate();
    let overtime=0,worked=0,paidExtra=0;
    for(let d=1;d<=dim;d++){
      const e=getEntry(y,m,d);if(!e)continue;
      const c=computeHours(y,m,d,e,holidays);
      worked+=c.net;overtime+=c.overtime;paidExtra+=c.paidExtra;
    }
    return{worked,overtime,paidExtra};
  }

  const monthlyData=useMemo(()=>MONTHS_SHORT.map((_,m)=>monthAggregate(year,m)),[entries,year,holidays]);

  const allYearsOvertime=useMemo(()=>{
    const years=[...new Set(Object.keys(entries).map(k=>Number(k.split("-")[0])))];
    let total=0;
    for(const y of years){
      const yh=getBremenHolidays(y);
      for(let m=0;m<12;m++){
        const dim=new Date(y,m+1,0).getDate();
        for(let d=1;d<=dim;d++){
          const e=entries[dateKey(y,m,d)];if(!e)continue;
          const c=computeHours(y,m,d,e,yh);
          total+=c.overtime;
        }
      }
    }
    const adjTotal=adjustments.reduce((s,a)=>s+a.hours,0);
    return total-adjTotal;
  },[entries,adjustments]);

  const yearAdj=adjustments.filter(a=>new Date(a.date).getFullYear()===year);
  const yearAdjTotal=yearAdj.reduce((s,a)=>s+a.hours,0);
  const yearOvertime=monthlyData.reduce((s,m)=>s+m.overtime,0);
  const yearPaidExtra=monthlyData.reduce((s,m)=>s+m.paidExtra,0);
  const yearWorked=monthlyData.reduce((s,m)=>s+m.worked,0);
  const curMonthData=monthlyData[month];

  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDow=(new Date(year,month,1).getDay()+6)%7;

  return(
    <div style={{minHeight:"100vh",background:"#06090F",color:"#CBD5E1",fontFamily:"'IBM Plex Sans','Helvetica Neue',sans-serif"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
        .fu{animation:fadeUp .3s ease}.si{animation:scaleIn .22s ease}
        .dcell{transition:background .12s;}.dcell:hover{background:#0d1829!important;}
        .tab:hover{color:#93C5FD!important;}.month-btn:hover{background:#0d1829!important;}
        input,select{font-family:inherit;outline:none;color-scheme:dark;}
        button{cursor:pointer;font-family:inherit;}
      `}</style>

      {/* Top Bar */}
      <div style={{background:"#030508",borderBottom:"1px solid #0f172a",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{width:28,height:28,borderRadius:7,background:"linear-gradient(135deg,#2563EB,#1d4ed8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>⚕️</div>
          <div style={{display:"flex",flexDirection:"column"}}>
            <div style={{fontSize:13,fontWeight:600,lineHeight:1.2}}>Arzt Zeitkonto</div>

            {MONTHS_SHORT.map((ms,i)=>{
              const md=monthlyData[i];const active=i===month;
              return(<button key={ms} className="month-btn" onClick={()=>setMonth(i)} style={{flex:"0 0 auto",padding:"5px 10px",borderRadius:7,fontSize:11,background:active?"#0f2044":"#08111f",border:active?"1px solid #2563EB":"1px solid #0f172a",color:active?"#93C5FD":"#475569",transition:"all .15s"}}>
                <div style={{fontWeight:active?600:400}}>{ms}</div>
                {md.overtime>0&&<div style={{fontSize:9,marginTop:1,color:"#4ADE80",fontFamily:"'IBM Plex Mono'"}}>+{fmtHAbs(md.overtime)}</div>}
              </button>);
            })}
          </div>

          {/* Month header */}
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <h2 style={{fontSize:20,fontWeight:300,color:"#E2E8F0"}}>{MONTHS_LONG[month]} <span style={{color:"#1e293b"}}>{year}</span></h2>
            <div style={{display:"flex",gap:12}}>
              {[{l:"Gearbeitet",v:fmtHAbs(curMonthData.worked),c:"#60A5FA"},{l:"Überstunden",v:`+${fmtHAbs(curMonthData.overtime)}`,c:"#4ADE80"},
                ...(curMonthData.paidExtra>0?[{l:"Ausgezahlt",v:fmtHAbs(curMonthData.paidExtra),c:"#FCD34D"}]:[])
              ].map(s=>(
                <div key={s.l} style={{textAlign:"right"}}>
                  <div style={{fontSize:9,color:"#334155",letterSpacing:.8,marginBottom:1}}>{s.l.toUpperCase()}</div>
                  <div style={{fontFamily:"'IBM Plex Mono'",fontSize:14,fontWeight:600,color:s.c}}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Calendar */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
            {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10,color:"#1e293b",padding:"3px 0",fontWeight:600,letterSpacing:.5}}>{d}</div>
            ))}
          </div>

          {(()=>{
            const cells=[
              ...Array.from({length:firstDow},(_,i)=>({empty:true,key:`e${i}`})),
              ...Array.from({length:daysInMonth},(_,i)=>({day:i+1})),
            ];
            while(cells.length%7!==0)cells.push({empty:true,key:`t${cells.length}`});
            const weeks=[];for(let w=0;w<cells.length/7;w++)weeks.push(cells.slice(w*7,w*7+7));
            return weeks.map((week,wi)=>{
              let weekWorked=0,weekPaid=0;
              week.forEach(cell=>{
                if(!cell.day)return;
                const e=getEntry(year,month,cell.day);if(!e)return;
                const c=computeHours(year,month,cell.day,e,holidays);
                weekWorked+=c.net+c.paidExtra;weekPaid+=c.paidExtra;
              });
              return(
                <div key={wi}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:2}}>
                    {week.map((cell,ci)=>{
                      if(cell.empty)return<div key={cell.key||`ec${wi}${ci}`}/>;
                      const d=cell.day;
                      const dow=new Date(year,month,d).getDay();
                      const we=dow===0||dow===6;
                      const hol=isHoliday(year,month,d,holidays);
                      const holEve=!hol&&isHolidayEve(year,month,d,holidays)&&!we;
                      const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
                      const entry=getEntry(year,month,d);
                      const shift=entry?SHIFTS[entry.shiftType]:null;
                      const computed=entry?computeHours(year,month,d,entry,holidays):null;
                      return(
                        <div key={d} className="dcell" onClick={()=>setModalDay({year,month,day:d})} style={{
                          minHeight:72,borderRadius:8,padding:"6px 5px",
                          background:entry?"#08162a":we||hol?"#060a12":"#07101c",
                          border:isToday?"1px solid #2563EB":entry?`1px solid ${shift.color}44`:`1px solid ${hol?"#1c1040":"#0c1525"}`,
                          cursor:"pointer",opacity:hol?0.6:1,
                        }}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                            <span style={{fontSize:11,color:isToday?"#60A5FA":hol?"#a78bfa":we?"#1e293b":"#475569",fontWeight:isToday?700:400}}>{d}</span>
                            {holEve&&<span style={{fontSize:7,color:"#7c3aed"}}>VFT</span>}
                            {hol&&<span style={{fontSize:7,color:"#7c3aed"}}>FT</span>}
                          </div>
                          {shift&&!shift.isOnCall&&!shift.noTimer&&(<>
                            <div style={{fontSize:10,color:shift.color,fontWeight:500,marginBottom:1}}>{shift.icon} {shift.label}</div>
                            {entry.endTime&&<div style={{fontSize:9,color:"#334155",fontFamily:"'IBM Plex Mono'"}}>{fmtTime(SHIFTS[entry.shiftType].getStart?.(isFridayLike(year,month,d,holidays))||{h:0,m:0})}–{fmtTime(entry.endTime)}</div>}
                            {computed&&computed.overtime>0&&<div style={{fontSize:9,color:"#4ADE80",fontFamily:"'IBM Plex Mono'"}}>+{fmtHAbs(computed.overtime)}</div>}
                            {computed?.paidExtra>0&&<div style={{fontSize:8,color:"#FCD34D"}}>+{fmtHAbs(computed.paidExtra)} 💶</div>}
                          </>)}
                          {shift?.isOnCall&&<div style={{fontSize:10,color:shift.color}}>📞 {entry.onCallActivationHours>0&&<span style={{color:"#FCD34D"}}>{entry.onCallActivationHours}h</span>}</div>}
                          {shift?.noTimer&&<div style={{fontSize:10,color:shift.color}}>{shift.icon} {shift.label}</div>}
                        </div>
                      );
                    })}
                  </div>
                  {weekWorked>0&&(
                    <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:10,padding:"3px 6px 8px",marginBottom:4,borderBottom:"1px solid #0a1525",fontFamily:"'IBM Plex Mono'",fontSize:10}}>
                      <span style={{color:"#1e293b"}}>KW {getISOWeek(new Date(year,month,week.find(c=>c.day)?.day))}</span>
                      <span style={{color:"#475569"}}>Gearbeitet: <span style={{color:"#60A5FA"}}>{fmtHAbs(weekWorked)}</span></span>
                      {weekPaid>0&&<span style={{color:"#FCD34D"}}>Ausgezahlt: {fmtHAbs(weekPaid)}</span>}
                    </div>
                  )}
                </div>
              );
            });
          })()}

          {/* Legend */}
          <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:8}}>
            {Object.entries(SHIFTS).map(([k,s])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#334155"}}>
                <div style={{width:6,height:6,borderRadius:2,background:s.color}}/>{s.icon} {s.label}
              </div>
            ))}
            <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#334155"}}><span style={{color:"#7c3aed",fontSize:9}}>FT</span> Feiertag (Bremen)</div>
          </div>
        </div>
      )}

      {/* ── JAHRESAUSWERTUNG ── */}
      {view==="jahres"&&(
        <div className="fu" style={{maxWidth:820,margin:"0 auto",padding:"16px 12px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[
              {l:"Gesamtüberstunden (alle Jahre)",v:`+${fmtHAbs(allYearsOvertime)}`,c:"#4ADE80",big:true},
              {l:`Überstunden ${year}`,v:`+${fmtHAbs(yearOvertime)}`,c:"#60A5FA",big:true},
              {l:"Gesamtarbeitszeit",v:fmtHAbs(yearWorked),c:"#94A3B8"},
              {l:"Abgebaut / Ausgezahlt",v:fmtHAbs(yearAdjTotal),c:"#FCD34D"},
              {l:"Sofort ausgezahlte Stunden",v:fmtHAbs(yearPaidExtra),c:"#FCD34D"},
              {l:"Eingetragene Dienste",v:Object.keys(entries).filter(k=>k.startsWith(String(year))).length+" Tage",c:"#94A3B8"},
            ].map(c=>(
              <div key={c.l} style={{background:"#07101c",border:"1px solid #0f172a",borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:9,color:"#334155",letterSpacing:.8,marginBottom:5}}>{c.l.toUpperCase()}</div>
                <div style={{fontFamily:"'IBM Plex Mono'",fontSize:c.big?24:17,fontWeight:600,color:c.c}}>{c.v}</div>
              </div>
            ))}
          </div>

          {/* Bar chart */}
          <div style={{background:"#07101c",border:"1px solid #0f172a",borderRadius:10,padding:"16px",marginBottom:16}}>
            <div style={{fontSize:10,color:"#334155",letterSpacing:.8,marginBottom:12}}>MONATSSALDO {year}</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:3,height:80}}>
              {monthlyData.map((md,i)=>{
                const mx=Math.max(...monthlyData.map(m=>m.overtime),1);
                const pct=md.overtime/mx;const has=md.overtime>0;
                return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  {has&&<div style={{fontSize:7,color:"#4ADE80",fontFamily:"'IBM Plex Mono'"}}>{fmtHAbs(md.overtime)}</div>}
                  <div style={{width:"100%",height:`${Math.max(pct*56,has?3:1)}px`,background:has?"#22C55E":"#0f172a",borderRadius:"3px 3px 0 0"}}/>
                  <div style={{fontSize:9,color:i===month?"#60A5FA":"#1e293b",fontWeight:i===month?600:400}}>{MONTHS_SHORT[i]}</div>
                </div>);
              })}
            </div>
          </div>

          {/* Monthly table */}
          <div style={{background:"#07101c",border:"1px solid #0f172a",borderRadius:10,padding:"16px",marginBottom:16}}>
            <div style={{fontSize:10,color:"#334155",letterSpacing:.8,marginBottom:10}}>MONATSÜBERSICHT {year}</div>
            <div style={{display:"grid",gridTemplateColumns:"60px 1fr 1fr 1fr",gap:0}}>
              {["MONAT","GEARBEITET","ÜBERSTUNDEN","AUSGEZAHLT"].map(h=>(
                <div key={h} style={{fontSize:9,color:"#1e293b",letterSpacing:.6,padding:"3px 6px",borderBottom:"1px solid #0f172a"}}>{h}</div>
              ))}
              {monthlyData.map((md,i)=>[
                <div key={`m${i}`} style={{fontSize:11,color:i===month?"#60A5FA":"#475569",padding:"6px",borderBottom:"1px solid #060d1a",fontWeight:i===month?600:400}}>{MONTHS_SHORT[i]}</div>,
                <div key={`w${i}`} style={{fontSize:11,color:"#94A3B8",padding:"6px",borderBottom:"1px solid #060d1a",fontFamily:"'IBM Plex Mono'"}}>{md.worked>0?fmtHAbs(md.worked):"–"}</div>,
                <div key={`d${i}`} style={{fontSize:11,color:md.overtime>0?"#4ADE80":"#334155",padding:"6px",borderBottom:"1px solid #060d1a",fontFamily:"'IBM Plex Mono'",fontWeight:500}}>{md.overtime>0?`+${fmtHAbs(md.overtime)}`:"–"}</div>,
                <div key={`p${i}`} style={{fontSize:11,color:"#FCD34D",padding:"6px",borderBottom:"1px solid #060d1a",fontFamily:"'IBM Plex Mono'"}}>{md.paidExtra>0?fmtHAbs(md.paidExtra):"–"}</div>,
              ])}
            </div>
          </div>

          {/* Adjustments */}
          <div style={{background:"#07101c",border:"1px solid #0f172a",borderRadius:10,padding:"16px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <div style={{fontSize:10,color:"#334155",letterSpacing:.8}}>ABBUCHUNGEN {year}</div>
              <button onClick={()=>{setAdjForm({date:`${year}-01-01`,hours:"",type:"abgefeiert",note:""});setAdjModal(true);}} style={{background:"#0f2044",border:"1px solid #2563EB",color:"#93C5FD",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:500}}>+ Eintrag</button>
            </div>
            {yearAdj.length===0&&<div style={{color:"#1e293b",fontSize:13,textAlign:"center",padding:"14px 0"}}>Keine Abbuchungen für {year}</div>}
            {yearAdj.map((a,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 4px",borderRadius:6}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:a.type==="abgefeiert"?"#4ADE80":"#FCD34D",flexShrink:0}}/>
                <div style={{fontFamily:"'IBM Plex Mono'",fontSize:10,color:"#475569",minWidth:76}}>{new Date(a.date).toLocaleDateString("de-DE")}</div>
                <div style={{flex:1,fontSize:12}}>{a.note||"–"}</div>
                <div style={{fontSize:10,color:a.type==="abgefeiert"?"#4ADE80":"#FCD34D",background:"#0a1626",padding:"2px 8px",borderRadius:20}}>{a.type==="abgefeiert"?"Abgefeiert":"Ausgezahlt"}</div>
                <div style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#F87171",minWidth:48,textAlign:"right"}}>-{fmtHAbs(a.hours)}</div>
                <button onClick={()=>onSaveAdjustments(adjustments.filter((_,j)=>j!==adjustments.indexOf(a)))} style={{background:"none",border:"none",color:"#1e293b",fontSize:16,padding:"0 2px"}}>×</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── DIENSTE INFO ── */}
      {view==="dienste"&&(
        <div className="fu" style={{maxWidth:820,margin:"0 auto",padding:"16px 12px"}}>
          <h2 style={{fontSize:17,fontWeight:300,color:"#94A3B8",marginBottom:16}}>Dienstformen & Regelungen</h2>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {Object.entries(SHIFTS).map(([k,s])=>(
              <div key={k} style={{background:"#07101c",border:`1px solid ${s.color}33`,borderLeft:`3px solid ${s.color}`,borderRadius:10,padding:"12px 14px"}}>
                <div style={{fontSize:14,marginBottom:5}}>{s.icon} <span style={{color:s.color,fontWeight:600}}>{s.label}</span></div>
                <div style={{fontSize:11,color:"#475569",fontFamily:"'IBM Plex Mono'",lineHeight:1.7}}>
                  {k==="TAGDIENST"&&<><div>Mo–Do: 07:00–16:00</div><div>Fr/VFT: 07:00–15:30</div><div>Pause: 30min (ab 9h: 45min)</div></>}
                  {k==="LANGER_DIENST"&&<><div>Mo–Do: 07:30–19:30</div><div>Fr/VFT: 09:00–21:00</div><div>Überstunden über Soll → sofort ausgezahlt</div></>}
                  {k==="LANGER_DIENST_WE"&&<><div>Sa/So: 08:30–20:30</div><div>Überstunden über Soll → sofort ausgezahlt</div></>}
                  {k==="VISITENDIENST"&&<><div>08:30–11:30 (Pflichtteil)</div><div>Ab 11:30: sofort ausgezahlt</div><div>📞 Rufbereitschaft danach</div></>}
                  {k==="SPAETDIENST"&&<><div>10:30–22:30 (Pflichtteil)</div><div>Ab 22:30: sofort ausgezahlt</div><div>📞 Rufbereitschaft danach</div></>}
                  {k==="RUFBEREITSCHAFT"&&<div>Nur Einsatzstunden (ausgezahlt)</div>}
                  {k==="URLAUB"&&<div>Tagessoll zählt als gearbeitet</div>}
                  {k==="KRANK"&&<div>Tagessoll zählt als gearbeitet</div>}
                  {k==="FORTBILDUNG"&&<div>8h zählen als gearbeitet</div>}
                </div>
              </div>
            ))}
          </div>
          <div style={{background:"#07101c",border:"1px solid #0f172a",borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:10,color:"#334155",letterSpacing:.8,marginBottom:8}}>SOLLZEIT-GRUNDLAGE</div>
            <div style={{fontFamily:"'IBM Plex Mono'",fontSize:12,color:"#475569",lineHeight:2}}>
              <div>Tagessoll Mo–Do: <span style={{color:"#2563EB"}}>8:30 h</span></div>
              <div>Tagessoll Fr / Vortag Feiertag: <span style={{color:"#2563EB"}}>8:00 h</span></div>
              <div>Pause: <span style={{color:"#2563EB"}}>30min (&lt;9h) · 45min (≥9h)</span></div>
              <div>Feiertage Bremen: <span style={{color:"#7c3aed"}}>automatisch erkannt</span></div>
            </div>
          </div>
        </div>
      )}

      {/* Day Modal */}
      {modalDay&&(
        <DayModal
          day={modalDay} holidays={holidays}
          entry={getEntry(modalDay.year,modalDay.month,modalDay.day)}
          onSave={data=>{onSaveEntry(dateKey(modalDay.year,modalDay.month,modalDay.day),data);setModalDay(null);}}
          onDelete={()=>{onDeleteEntry(dateKey(modalDay.year,modalDay.month,modalDay.day));setModalDay(null);}}
          onClose={()=>setModalDay(null)}
        />
      )}

      {/* Adj Modal */}
      {adjModal&&(
        <AdjModal form={adjForm} onChange={setAdjForm}
          onSave={()=>{
            if(!adjForm.hours||isNaN(+adjForm.hours))return;
            onSaveAdjustments([...adjustments,{...adjForm,hours:+adjForm.hours}]);
            setAdjModal(false);
          }}
          onClose={()=>setAdjModal(false)}
        />
      )}
    </div>
  );
}

// ─── Day Modal ────────────────────────────────────────────────────────────────
function DayModal({day,entry,holidays,onSave,onDelete,onClose}){
  const {year,month,day:d}=day;
  const dow=new Date(year,month,d).getDay();
  const dowLabel=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][dow];
  const we=dow===0||dow===6;
  const hol=isHoliday(year,month,d,holidays);
  const fri=isFridayLike(year,month,d,holidays);

  const [shiftType,setShiftType]=useState(entry?.shiftType||(we?"LANGER_DIENST_WE":"TAGDIENST"));
  const [endH,setEndH]=useState(entry?.endTime?.h??"");
  const [endM,setEndM]=useState(entry?.endTime?.m??"");
  const [onCallH,setOnCallH]=useState(entry?.onCallActivationHours??"");
  const [note,setNote]=useState(entry?.note||"");

  const shift=SHIFTS[shiftType];
  const startT=shift.getStart?.(fri);
  const fixedEnd=shift.fixedEnd;
  const defaultEnd=fixedEnd||shift.getEnd?.(fri);
  const endTime=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;

  let preview=null;
  if(startT&&endTime&&!shift.noTimer&&!shift.isOnCall){
    let gm=toMin(endTime)-toMin(startT);if(gm<0)gm+=24*60;
    const bm=calcBreak(gm-30);const nh=(gm-bm)/60;
    const soll=getDailySoll(year,month,d,holidays);
    let pe=0;
    if(shift.hasPaidExtra&&shift.fixedEnd){const et=toMin(endTime),ft=toMin(fixedEnd);if(et>ft)pe=(et-ft)/60;}
    else if(shift.paidExtraAfterSoll){const ov=nh-soll;if(ov>0)pe=ov;}
    const ot=shift.paidExtraAfterSoll?0:Math.max(0,nh-pe-soll);
    preview={net:nh-pe,soll,gross:gm/60,breakMin:bm,paidExtra:pe,overtime:ot};
  }

  const availableShifts=Object.entries(SHIFTS).filter(([k,s])=>{
    if(s.weekendOnly&&!we)return false;
    if(!s.weekendOnly&&k==="LANGER_DIENST_WE"&&!we)return false;
    return true;
  });

  return(
    <div style={{position:"fixed",inset:0,background:"#000000CC",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:12}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:"#07101c",border:"1px solid #1e293b",borderRadius:16,padding:"22px",width:440,maxWidth:"100%",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{fontSize:10,color:"#334155",letterSpacing:.8,marginBottom:3}}>DIENST EINTRAGEN</div>
            <div style={{fontSize:16,fontWeight:500,color:"#E2E8F0"}}>{dowLabel}, {d}. {MONTHS_LONG[month]} {year}</div>
            {(hol||fri)&&<div style={{fontSize:11,color:"#7c3aed",marginTop:2}}>{hol?"🎌 Feiertag (Bremen)":"⚡ Vortag Feiertag – wie Freitag gewertet"}</div>}
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#334155",fontSize:22,lineHeight:1}}>×</button>
        </div>

        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:7}}>DIENSTFORM</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
            {availableShifts.map(([k,s])=>(
              <button key={k} onClick={()=>setShiftType(k)} style={{padding:"7px 8px",borderRadius:8,textAlign:"left",fontSize:12,background:shiftType===k?"#0a1e38":"#050d18",border:shiftType===k?`1px solid ${s.color}`:"1px solid #0f172a",color:shiftType===k?s.color:"#334155",transition:"all .15s"}}>
                {s.icon} {s.label}
              </button>
            ))}
          </div>
        </div>

        {startT&&(
          <div style={{background:"#050d18",borderRadius:8,padding:"9px 11px",marginBottom:12,fontFamily:"'IBM Plex Mono'",fontSize:11}}>
            <div style={{color:"#475569"}}>Start: <span style={{color:"#60A5FA"}}>{fmtTime(startT)}</span>
              {fixedEnd&&<> · Pflichtende: <span style={{color:"#60A5FA"}}>{fmtTime(fixedEnd)}</span></>}
              {!fixedEnd&&defaultEnd&&<> · Planende: <span style={{color:"#475569"}}>{fmtTime(defaultEnd)}</span></>}
            </div>
            {shift.hasOnCall&&<div style={{color:"#A78BFA",marginTop:2}}>📞 Rufbereitschaft nach Dienstende</div>}
            {shift.hasPaidExtra&&<div style={{color:"#FCD34D",marginTop:2}}>💶 Überstunden werden sofort ausgezahlt</div>}
          </div>
        )}

        {!shift.noTimer&&!shift.isOnCall&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:7}}>{shift.hasPaidExtra?"TATSÄCHLICHE ENDZEIT":"ENDZEIT (leer = Planende)"}</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input type="number" min={0} max={23} value={endH} onChange={e=>setEndH(e.target.value)} placeholder={defaultEnd?pad(defaultEnd.h):"hh"}
                style={{width:60,background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 10px",fontSize:16,fontFamily:"'IBM Plex Mono'",color:"#E2E8F0",textAlign:"center"}}/>
              <span style={{fontSize:18,color:"#334155"}}>:</span>
              <input type="number" min={0} max={59} value={endM} onChange={e=>setEndM(e.target.value)} placeholder={defaultEnd?pad(defaultEnd.m):"mm"}
                style={{width:60,background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 10px",fontSize:16,fontFamily:"'IBM Plex Mono'",color:"#E2E8F0",textAlign:"center"}}/>
              <span style={{fontSize:12,color:"#334155",marginLeft:2}}>Uhr</span>
              {(endH!==""||endM!=="")&&<button onClick={()=>{setEndH("");setEndM("");}} style={{background:"none",border:"none",color:"#334155",fontSize:16,marginLeft:2}}>↺</button>}
            </div>
          </div>
        )}

        {shift.isOnCall&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:7}}>AKTIVIERUNGSSTUNDEN (ausgezahlt, kein Saldo)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="z.B. 1.5"
              style={{width:"100%",background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px",fontSize:14,fontFamily:"'IBM Plex Mono'",color:"#E2E8F0"}}/>
          </div>
        )}

        {shift.hasOnCall&&!shift.isOnCall&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"#A78BFA",letterSpacing:.8,marginBottom:7}}>📞 AKTIVIERUNGEN IN RUFBEREITSCHAFT (ausgezahlt)</div>
            <input type="number" min={0} max={24} step={0.5} value={onCallH} onChange={e=>setOnCallH(e.target.value)} placeholder="Einsatzstunden (optional)"
              style={{width:"100%",background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px",fontSize:13,fontFamily:"'IBM Plex Mono'",color:"#E2E8F0"}}/>
          </div>
        )}

        {preview&&(
          <div style={{background:"#030508",border:"1px solid #0f172a",borderRadius:8,padding:"11px 12px",marginBottom:14,fontFamily:"'IBM Plex Mono'",fontSize:12}}>
            <div style={{color:"#334155",marginBottom:5,fontSize:10,letterSpacing:.8}}>VORSCHAU</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              <div><div style={{color:"#1e293b",fontSize:9}}>BRUTTO</div><div style={{color:"#94A3B8"}}>{fmtHAbs(preview.gross)}</div></div>
              <div><div style={{color:"#1e293b",fontSize:9}}>PAUSE</div><div style={{color:"#94A3B8"}}>{preview.breakMin}min</div></div>
              <div><div style={{color:"#1e293b",fontSize:9}}>NETTO</div><div style={{color:"#60A5FA"}}>{fmtHAbs(preview.net)}</div></div>
            </div>
            {preview.paidExtra>0&&<div style={{color:"#FCD34D",marginTop:7,fontSize:11}}>💶 Sofort ausgezahlt: {fmtHAbs(preview.paidExtra)}</div>}
            <div style={{marginTop:7,fontSize:11}}>
              {preview.overtime>0?<span style={{color:"#4ADE80",fontWeight:600}}>+{fmtHAbs(preview.overtime)} Überstunden (Saldo)</span>
                :preview.paidExtra>0?<span style={{color:"#FCD34D"}}>Überstunden direkt ausgezahlt</span>
                :<span style={{color:"#94A3B8"}}>Keine Überstunden (unter Soll)</span>}
              <span style={{color:"#1e293b",marginLeft:8}}>Soll: {fmtHAbs(preview.soll)}</span>
            </div>
          </div>
        )}

        <div style={{marginBottom:18}}>
          <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:7}}>NOTIZ (optional)</div>
          <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder="Station, Einsatz, Bemerkung..."
            style={{width:"100%",background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px",fontSize:13,color:"#E2E8F0",fontFamily:"inherit"}}/>
        </div>

        <div style={{display:"flex",gap:8}}>
          {entry&&<button onClick={onDelete} style={{padding:"10px 14px",background:"none",border:"1px solid #3f0f0f",borderRadius:8,color:"#F87171",fontSize:13}}>Löschen</button>}
          <button onClick={()=>{const et=(endH!==""&&endM!=="")?{h:+endH,m:+endM}:defaultEnd;onSave({shiftType,endTime:et,onCallActivationHours:onCallH!==""?+onCallH:0,note});}} style={{flex:1,padding:"11px 0",background:"#1d4ed8",border:"none",borderRadius:8,color:"#fff",fontSize:14,fontWeight:600}}>Speichern</button>
        </div>
      </div>
    </div>
  );
}

// ─── Adj Modal ────────────────────────────────────────────────────────────────
function AdjModal({form,onChange,onSave,onClose}){
  return(
    <div style={{position:"fixed",inset:0,background:"#000000CC",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:12}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="si" style={{background:"#07101c",border:"1px solid #1e293b",borderRadius:16,padding:"22px",width:370,maxWidth:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
          <div style={{fontSize:15,fontWeight:500,color:"#E2E8F0"}}>Überstunden abbuchen</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#334155",fontSize:22}}>×</button>
        </div>
        {[{l:"DATUM",f:"date",t:"date"},{l:"STUNDEN",f:"hours",t:"number",pl:"z.B. 8"},{l:"NOTIZ",f:"note",t:"text",pl:"z.B. Freizeitausgleich KW 12"}].map(field=>(
          <div key={field.f} style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:5}}>{field.l}</div>
            <input type={field.t} value={form[field.f]} placeholder={field.pl} step={field.t==="number"?"0.5":undefined}
              onChange={e=>onChange(p=>({...p,[field.f]:e.target.value}))}
              style={{width:"100%",background:"#050d18",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px",color:"#E2E8F0",fontSize:13,fontFamily:"inherit"}}/>
          </div>
        ))}
        <div style={{marginBottom:18}}>
          <div style={{fontSize:10,color:"#475569",letterSpacing:.8,marginBottom:7}}>TYP</div>
          <div style={{display:"flex",gap:8}}>
            {[["abgefeiert","Abgefeiert 🟢"],["ausgezahlt","Ausgezahlt 🟡"]].map(([v,l])=>(
              <button key={v} onClick={()=>onChange(p=>({...p,type:v}))} style={{flex:1,padding:"9px 0",borderRadius:8,fontSize:13,background:form.type===v?(v==="abgefeiert"?"#052e16":"#422006"):"#050d18",border:`1px solid ${form.type===v?(v==="abgefeiert"?"#4ADE80":"#FCD34D"):"#1e293b"}`,color:form.type===v?(v==="abgefeiert"?"#4ADE80":"#FCD34D"):"#475569"}}>{l}</button>
            ))}
          </div>
        </div>
        <button onClick={onSave} style={{width:"100%",padding:"11px 0",background:"#1d4ed8",border:"none",borderRadius:8,color:"#fff",fontSize:14,fontWeight:600}}>Speichern</button>
      </div>
    </div>
  );
}

// ─── Render ───────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
